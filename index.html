      setIcon(); host.dataset.on = "0"; return;
    }
    blobURLs[v.id] = URL.createObjectURL(blob);
    mountVideo(blobURLs[v.id], "file");
  }).catch(e=>{
    host.innerHTML = `<div class="hint">재생 실패: ${esc(e.message||e)}</div>`;
    setIcon(); host.dataset.on = "0";
  });
}

/* ============================ 내보내기 / 불러오기 ============================ */
let _dlNs = null, _dlTried = false;
async function dlNs(){
  if(_dlTried) return _dlNs;
  _dlTried = true;
  try{ _dlNs = (window.claude && typeof window.claude.use==="function")? await window.claude.use("downloads") : null; }
  catch(e){ _dlNs = null; }
  return _dlNs;
}
function anchorDownload(name, blob){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function mimeOf(name){
  if(/\.json$/i.test(name)) return {"application/json":[".json"]};
  if(/\.csv$/i.test(name))  return {"text/csv":[".csv"]};
  if(/\.zip$/i.test(name))  return {"application/zip":[".zip"]};
  return {"application/octet-stream":[".bin"]};
}
/* 모바일(아이폰·아이패드 등) — 공유 시트로 저장 위치를 직접 고르게 합니다.
   iOS는 "파일에 저장"을 고르면 아이클라우드·내 아이패드 등 원하는 폴더에 넣을 수 있고,
   같은 이름이면 "바꾸기"로 덮어쓸 수 있습니다. */
async function shareFile(name, blob){
  try{
    if(!navigator.canShare || !window.File) return false;
    const f = new File([blob], name, {type: blob.type || "application/octet-stream"});
    if(!navigator.canShare({files:[f]})) return false;
    await navigator.share({files:[f], title:name});
    return true;
  }catch(e){
    if(e && (e.name==="AbortError" || e.name==="NotAllowedError")) return true;   // 사용자가 닫음
    return false;
  }
}
function fname(base, ext){
  return base + (S.settings.stampNames? "_"+stamp() : "") + "." + ext;
}
/* key 는 내보내기 종류(json/batting/…) — 한 번 고른 파일을 기억해 두고 다음부터 덮어씁니다 */
async function download(name, blob, key){
  // 1) 저장 폴더가 연결돼 있으면 그 폴더에 바로 덮어쓰기
  if(dirHandle && !fsNeedGrant && fsMode === "rw" && S.settings.exportToFolder!==false && !S.settings.pickEach){
    try{
      const fh = await dirHandle.getFileHandle(name, {create:true});
      const w  = await fh.createWritable();
      await w.write(blob); await w.close();
      toast("저장 폴더에 저장했습니다 · " + name);
      return;
    }catch(e){ fsErr = errText(e); console.warn(e); }
  }
  // 2) 기억해 둔 파일에 덮어쓰기 (PC 크롬·엣지, 안드로이드 크롬)
  if(FS_SAVE_OK && key){
    try{
      let h = null;
      if(!S.settings.pickEach){
        try{ h = await hGet("exp:"+key); }catch(e){ h=null; }
        if(h && !(await ensurePerm(h,"readwrite",true))) h = null;
      }
      if(!h){
        h = await window.showSaveFilePicker({
          suggestedName: name,
          startIn: dirHandle || "downloads",
          types: [{description:"내보내기 파일", accept: mimeOf(name)}]
        });
        try{ await hSet("exp:"+key, h); }catch(e){}
      }
      const w = await h.createWritable();
      await w.write(blob); await w.close();
      toast("저장했습니다 · " + (h.name||name));
      return;
    }catch(e){
      if(e && e.name === "AbortError") return;               // 사용자가 취소
      console.warn("파일 저장 실패", e);
    }
  }
  // 3) 모바일 공유 시트 — 저장 위치를 직접 고를 수 있습니다
  if(S.settings.pickEach || !FS_SAVE_OK){
    if(await shareFile(name, blob)) return;
  }
  // 4) 앱 내장 다운로드 경로
  const ns = await dlNs();
  if(ns){
    try{ await ns.save({filename:name, data:blob}); toast("파일을 저장했습니다"); return; }
    catch(e){
      const code = e && e.code;
      if(code === "declined" || code === "rate_limited") return;
      if(code === "extension_not_enabled" || code === "rejected_extension"){
        try{ await ns.save({filename:name.replace(/\.[^.]+$/,"")+".txt", data:blob});
             toast("이 환경에서는 .txt로 저장됩니다"); return; }catch(e2){}
      }
      if(code === "too_large"){ toast("파일이 너무 커서 저장할 수 없습니다"); return; }
    }
  }
  // 5) 마지막 수단 — 일반 다운로드
  anchorDownload(name, blob);
  toast("파일을 내보냈습니다");
}

function sampleData(){
  const rnd = (a)=> a[Math.floor(Math.random()*a.length)];
  const opps = ["레드윙스","블루호크","그린타이거","시티유니온","리버독스"];
  const vens = ["시립야구장","제2구장","리버파크"];
  const pits = ["김성현","박태윤","이도현","최민재"];
  const codes = ["1B","1B","1B","2B","HR","BB","HBP","K","K","GO","GO","FO","LO","DP","SF","ROE","FC","3B"];
  const base = new Date(); base.setDate(base.getDate()-70);
  for(let i=0;i<8;i++){
    const d = new Date(base.getTime() + i*8*86400000);
    const date = d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
    const g = {id:uid(), date, opponent:rnd(opps), venue:rnd(vens), homeAway:i%2?"원정":"홈", type:(i%3===0?"practice":"official"),
      myScore:String(2+Math.floor(Math.random()*8)), oppScore:String(1+Math.floor(Math.random()*8)),
      note:"", pas:[], def:[], videos:[]};
    const n = 3+Math.floor(Math.random()*2);
    for(let j=0;j<n;j++){
      const c = rnd(codes);
      const r = RMAP[c];
      let zone=null;
      if(r.bip){
        const gm = geom(curLevel());
        const ang = (Math.random()*84-42)*Math.PI/180;
        const maxR = fenceR(gm, ang);
        const dist = c==="HR"? maxR*0.96 : (Math.random()<0.42? gm.baseU*(0.5+Math.random()*0.9) : gm.inU + Math.random()*(maxR-gm.inU)*0.95);
        zone = clampFair(FIELD.hx + Math.sin(ang)*dist, FIELD.hy - Math.cos(ang)*dist, curLevel());
      }
      g.pas.push({id:uid(), inning:1+j*2+Math.floor(Math.random()*2), pitcher:rnd(pits), result:c, zone,
        rbi: c==="HR"? 1+Math.floor(Math.random()*3) : (r.h||c==="SF")? Math.floor(Math.random()*2):0,
        runs: c==="HR"?1:(r.h?Math.floor(Math.random()*2):0), sb:(c==="1B"||c==="BB")?Math.floor(Math.random()*2):0,
        cs:(c==="1B"||c==="BB")&&Math.random()<0.18?1:0, note:""});
    }
    if(i%3===1){
      // 투수 등판 — 이닝별로 한 건씩 (총 이닝·승패는 앱이 자동 계산)
      const types = ["FB","FB","FB","FB","SL","SL","CB","CH","TS"];
      const reses = ["CS","CS","SS","F","B","B","B","X"];
      const zx=(ZONE.x0+ZONE.x1)/2, zy=(ZONE.y0+ZONE.y1)/2, zw=ZONE.x1-ZONE.x0, zh=ZONE.y1-ZONE.y0;
      const nInn = 3+Math.floor(Math.random()*3);
      for(let inn=1; inn<=nInn; inn++){
        const outs = (inn===nInn && Math.random()<0.35)? 1+Math.floor(Math.random()*2) : 3;
        const so = Math.min(outs, Math.random()<0.55? 1+Math.floor(Math.random()*2) : 0);
        const h  = Math.random()<0.55? 1+Math.floor(Math.random()*2) : 0;
        const bb = Math.random()<0.3? 1 : 0;
        const r  = (h+bb)>=2 && Math.random()<0.5? 1+Math.floor(Math.random()*2) : 0;
        const pitches = [];
        const npn = 10+Math.floor(Math.random()*10) + (h+bb)*3;
        for(let q=0;q<npn;q++){
          const rr = rnd(reses), tt = rnd(types);
          const spread = rr==="B"? 1.5 : 0.86;
          const pt2 = clampZone(zx+(Math.random()-.5)*zw*spread + (Math.random()-.5)*10,
                                zy+(Math.random()-.5)*zh*spread + (rr==="B"? 14:0));
          pitches.push({x:pt2.x, y:pt2.y, t:tt, r:rr, v:104+Math.floor(Math.random()*22), pv:2});
        }
        g.def.push({id:uid(), pos:"P", inning:inn, result:"", innings:String(outs2inn(outs)),
          po:0, a:Math.random()<0.4?1:0, e:0, dp:0, note:inn===1?"선발 등판":"",
          pit:{outs, ip:String(outs2inn(outs)), dec:"", tbf:outs+h+bb, h, hr:Math.random()<0.12?1:0,
            bb, hbp:Math.random()<0.06?1:0, so, r, er:r,
            np:pitches.length, st:pitches.filter(x=>isStrikeRes(x.r)).length, pitches}});
      }
    } else {
      // 수비 — 출장 이닝 1건 + 이닝별 수비 장면 몇 건
      const dpos = rnd(["SS","2B","CF","LF","1B"]);
      g.def.push({id:uid(), pos:dpos, inning:1, result:"INN",
        innings:String(5+Math.floor(Math.random()*3))+"."+Math.floor(Math.random()*3),
        po:0, a:0, e:0, dp:0, note:"선발 출장"});
      const dcodes = ["PO","A","A","DP","NP","EF","ET"];
      const dn = 2+Math.floor(Math.random()*3);
      for(let k=0;k<dn;k++){
        const dc = rnd(dcodes), dr = DMAP[dc];
        g.def.push({id:uid(), pos:dpos, inning:2+k*2-Math.floor(Math.random()*2), result:dc, innings:"",
          po:dr.po||0, a:dr.a||0, e:dr.e||0, dp:dr.dp||0, note:""});
      }
    }
    g.def.sort((x,y)=> num(x.inning,0)-num(y.inning,0));
    S.games.push(g);
  }
  if(!S.profile.name){ S.profile.name="샘플 선수"; S.profile.team="샘플 클럽"; S.profile.number="7"; S.profile.position="SS"; }
  saveNow(); render(); toast("샘플 8경기를 추가했습니다");
}

function readVideoLink(){

function updateVideo(gid, vid){
  const g = S.games.find(x=>x.id===gid); if(!g) return;
  const v = g.videos.find(x=>x.id===vid); if(!v) return;
  const lk = readVideoLink();
  if(v.kind==="link"){
    const url = $("#v_url").value.trim();
    if(!url){ toast("영상 주소를 입력해 주세요"); return; }
    v.url = url;
  }
  v.title = $("#v_title").value.trim() || v.title;
  v.note  = $("#v_note").value.trim();
  v.paId  = lk.paId; v.defId = lk.defId;
  saveNow(); closeSheet(); render(); toast("영상 정보를 수정했습니다");
}
function saveVideo(gid, btn){
  const g = S.games.find(x=>x.id===gid); if(!g) return;
  const kind = ($("#modal [data-act='vkind'][aria-pressed='true']")||{dataset:{v:"file"}}).dataset.v;
  const title = $("#v_title").value.trim();
  const lk = readVideoLink();
  const paId = lk.paId, defId = lk.defId;
  const note = $("#v_note").value.trim();
  if(kind==="link"){
    const url = $("#v_url").value.trim();
    if(!url){ toast("영상 주소를 입력해 주세요"); return; }
    g.videos.push({id:uid(), kind:"link", url, title:title||url.slice(0,60), paId, defId, note, createdAt:Date.now()});
    saveNow(); closeSheet(); render(); toast("영상 링크를 추가했습니다"); return;
  }
  const f = ($("#v_input").files||[])[0];
  if(!f){ toast("동영상 파일을 선택해 주세요"); return; }
  if(f.size > 800*1024*1024){ toast("800MB 이하 파일만 저장할 수 있습니다"); return; }
  const id = uid();
  btn.disabled = true; $("#v_prog").hidden = false;
  $("#v_prog .bar > i").style.width = "40%";
  const rec = {id, kind:"file", name:f.name, mime:f.type, size:f.size,
    title:title||f.name.replace(/\.[^.]+$/,""), paId, defId, note, createdAt:Date.now(), store:"idb"};
  mediaPut(rec, f).then(where=>{
    $("#v_prog .bar > i").style.width = "100%";
    g.videos.push(rec);
    saveNow(); flushFolder(); closeSheet(); render();
    toast(where==="fs"? "영상을 저장 폴더에 넣었습니다" : "영상을 이 기기에 저장했습니다");
  }).catch(e=>{
    btn.disabled = false; $("#v_prog").hidden = true;
    toast("저장 실패: 공간이 부족할 수 있습니다");
    console.error(e);
  });
}

/* --------------------- 뒤로(되돌아가기) 버튼 처리 ---------------------
   한 번 누르면 홈으로, 홈에서 두 번 연속 누르면 앱을 나갑니다.
   (시트가 열려 있으면 먼저 시트를 닫습니다)
   -------------------------------------------------------------------- */
let backArmed = 0;
function pushBackState(){ try{ history.pushState({bb:"app"}, ""); }catch(e){} }
function initBackButton(){
  if(!window.history || !history.pushState) return;
  try{ history.replaceState({bb:"root"}, ""); }catch(e){}
  pushBackState();
  window.addEventListener("popstate", ()=>{
    // 1) 열려 있는 시트/모달 먼저 닫기
    const m = $("#modal");
    if(m && m.innerHTML){ closeSheet(); pushBackState(); return; }
    // 2) 홈이 아니면 홈으로
    if(S.ui.gameId || S.ui.tab!=="home"){
      S.ui.gameId = null; S.ui.tab = "home"; save(); render();
      backArmed = 0; pushBackState(); return;
    }
    // 3) 홈에서 두 번 연속(2초 이내) 누르면 나가기
    const now = Date.now();
    if(now - backArmed < 2000){
      saveNow();
      try{ window.close(); }catch(e){}
      try{ history.back(); }catch(e){}
      // 나가지 못한 경우(이전 페이지가 없을 때)에는 앱을 계속 쓸 수 있도록 되돌립니다
      setTimeout(()=>{ backArmed = 0; pushBackState(); }, 600);
      return;
    }
    backArmed = now;
    toast("한 번 더 누르면 앱을 나갑니다");
    pushBackState();
  });
}

  const d=document.createElement("div"); d.id="envwarn"; d.className="note";
  d.style.cssText="margin-bottom:12px;border:1px solid var(--border)";
  d.innerHTML = !ENV.storage
    ? "이 브라우저(시크릿 모드 등)에서는 기록이 <b>저장되지 않습니다</b>. 일반 창에서 열어 주세요."
    : "이 환경에서는 동영상 <b>파일 저장</b>을 쓸 수 없습니다. 영상은 <b>링크 등록</b>으로 추가하거나, 이 파일을 웹 주소(http/https)로 열어 주세요.";
  v.insertBefore(d, v.firstChild);
}
/* 화면 위쪽 알림 — 폴더 연결 잠김 / 백업 권유 */
function banners(){
  let h = "";
  // 폴더를 쓰는데 아직 설치 전이면, 권한 창을 없애는 방법을 한 번 알려 줍니다
  if(dirHandle && !isInstalledApp() && installState()==="ready" && !S.ui.hideInstall && fsAskedOnce){
    h += `<div class="note" style="margin-bottom:12px;border:1px solid var(--border)">
      <b>앱으로 설치</b>하면 앱을 열 때마다 뜨는 폴더 권한 창이 사라집니다.
      <div class="btnrow" style="margin-top:8px">
        <button class="btn pri sm nb" data-act="installApp">지금 설치</button>
        <button class="btn sm nb" data-act="hideInstall">다시 보지 않기</button>
      </div></div>`;
  }
  // 권한 요청을 사용자가 거절했을 때만 안내합니다.
  // (거절하지 않았다면 화면의 첫 터치에서 자동으로 다시 연결됩니다)
  if(dirHandle && fsNeedGrant && fsDenied){
    h += `<div class="note" style="margin-bottom:12px;border:1px solid var(--border)">
      저장 폴더 <b>${esc(dirName)}</b>에 연결하지 못했습니다.
      <div class="btnrow" style="margin-top:8px"><button class="btn pri sm nb" data-act="grantFolder">폴더 다시 연결</button></div>
      <div class="hint" style="margin-top:8px">권한 창에서 <b>방문할 때마다 허용</b>을 고르면 다음부터는 묻지 않습니다.${
        isInstalledApp()? "" : `<br><b>홈 화면에 추가</b>(크롬 메뉴 → 앱 설치)해 두면 권한이 그대로 유지됩니다.`}</div></div>`;
  }
  if(!dirHandle && S.games.length){
    const b = S.backup||{};
    const stale = !b.at || (b.sig !== dataSig() && (Date.now()-b.at) > 3*86400000);
    if(stale){
      h += `<div class="note" style="margin-bottom:12px;border:1px solid var(--border)">
        기록이 이 브라우저 안에만 있습니다. 데이터를 지우면 함께 사라지니 백업해 두세요.
        <div class="btnrow" style="margin-top:8px">
          <button class="btn pri sm nb" data-act="exportBundle">전체 백업 (영상 포함)</button>
          ${FS_DIR_OK? `<button class="btn sm nb" data-act="pickFolder">저장 폴더 지정</button>`:""}
        </div></div>`;
    }
  }
  return h;
}
let lastTab = null;
function render(){
  const v = $("#view");
  calcChartFont();
  const t = S.ui.tab;
  const html = (t==="games" && S.ui.gameId)? viewGame(S.ui.gameId)
    : t==="games"? viewGames()
    : t==="stats"? viewStats()
    : t==="videos"? viewVideos()
    : t==="settings"? viewSettings()
    : viewHome();
  v.innerHTML = banners() + html;
  $$("nav.tabs button").forEach(b=>{
    if(b.dataset.nav===t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const sb = $("#setBtn");
  if(sb){ sb.classList.toggle("on", t==="settings"); sb.setAttribute("aria-current", t==="settings"? "page":"false"); }
  const p = S.profile;
  $("#subttl").textContent = p.name? [p.name, p.number?"#"+p.number:"", p.team].filter(Boolean).join(" · ") : "기록 · 분석 · 영상";
  if(lastTab!==t){ window.scrollTo(0,0); lastTab=t; }
  envBanner();
  fillQuota();
  fillMissing();
}
/* 영구 저장 요청 — 기기 저장공간이 부족할 때 시스템이 기록·영상을
   임의로 지우지 못하게 합니다. 홈 화면에 추가해 두면 승인될 확률이 높습니다. */
function askPersist(){
  if(!(navigator.storage && navigator.storage.persist)){ persistState="unsupported"; return Promise.resolve(); }
  return navigator.storage.persisted().then(already=>{
    if(already){ persistState=true; return; }
    return navigator.storage.persist().then(ok=>{ persistState=!!ok; });
  }).catch(()=>{ persistState="unsupported"; });
}

function fillQuota(){
  const els = $$("#quota"); if(!els.length) return;
  const tag = ()=>{
    if(persistState===true)  return `<span style="color:var(--good);font-weight:650">자동 저장 켜짐`;
    if(persistState===false) return `<span style="color:var(--warn);font-weight:650">자동 저장 꺼짐</span> - 기기 저장공간 부족`;
    return `영구 저장 상태를 확인할 수 없는 브라우저입니다.`;
  };
  const warn = saveFailed
    ? `<br><span style="color:var(--crit);font-weight:650">⚠ 마지막 저장이 실패했습니다.</span> 지금 바로 JSON으로 내보내 두세요.`
    : "";
  const draw = txt => els.forEach(e=> e.innerHTML = txt + `<br>` + tag() + warn);
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(q=>{
      const used = q.usage||0, quota = q.quota||0;
      draw(`이 기기 저장 사용량 <b>${bytes(used)}</b>${quota?` / 약 ${bytes(quota)} 사용 가능`:""}`);
    }).catch(()=> draw("저장 공간 정보를 확인할 수 없습니다"));
  } else draw("저장 공간 정보를 확인할 수 없습니다");
}
function curTheme(){ return document.documentElement.getAttribute("data-theme") || ""; }
function setTheme(v){
  if(v) document.documentElement.setAttribute("data-theme", v);
  else document.documentElement.removeAttribute("data-theme");
  try{ v? localStorage.setItem(THEME_KEY, v) : localStorage.removeItem(THEME_KEY); }catch(e){}
  render();
}
(function init(){
  try{ const th = localStorage.getItem(THEME_KEY); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
  load();
  try{ localStorage.setItem("__bb_t","1"); localStorage.removeItem("__bb_t"); }
  catch(e){ ENV.storage=false; }
  db().then(()=>{ ENV.idb=true; }).catch(()=>{ ENV.idb=false; envBanner(); });
  // 앱은 언제나 홈 화면에서, 경기 종류는 "전체"로 시작합니다
  // (시즌 선택은 마지막에 보던 것을 그대로 유지합니다)
  S.ui.tab = "home"; S.ui.gameId = null;
  S.ui.gtype = "all";
  render();
  askPersist().then(fillQuota);
  initFS().catch(e=>console.warn("폴더 연결 실패", e));
  // 설치 가능 신호는 조금 늦게 오기도 합니다
  window.__onInstallReady = ()=>{ if(S.ui.tab==="settings" || dirHandle) render(); };
  window.__onInstalled = ()=>{ render(); toast("앱으로 설치했습니다 — 이제 홈 화면 아이콘으로 열어 주세요"); };
  armFullscreen();
  ["fullscreenchange","webkitfullscreenchange"].forEach(ev=>
    document.addEventListener(ev, ()=>{ if(S.ui.tab==="settings") render(); }));
  initBackButton();
  window.addEventListener("beforeunload", saveNow);

  // 화면 회전·창 크기 변경 시 차트 글자 크기를 다시 맞춥니다
  let rsTimer = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(rsTimer);
    rsTimer = setTimeout(()=>{ const before = CFS; calcChartFont();
      if(Math.abs(before-CFS) > 0.2) render(); }, 200);
  });
  // 모바일은 beforeunload가 안 불리는 경우가 많아 화면 이탈 시점에도 저장
  window.addEventListener("pagehide", saveNow);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="hidden"){ saveNow(); return; }
    // 앱으로 돌아왔을 때 홈 화면으로. 단 입력 중(시트가 열려 있음)이면 그대로 둡니다.
    if($("#modal").innerHTML) return;
    if(dirHandle && fsNeedGrant) armAutoGrant();
    armFullscreen();
    if(S.ui.tab!=="home" || S.ui.gameId){ S.ui.tab="home"; S.ui.gameId=null; saveNow(); render(); }
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#modal").innerHTML) closeSheet(); });
  // 개발용 훅 (자동 검증에 사용)
  window.__bb = {get S(){return S;}, set S(v){S=v;}, render, save:saveNow, battingOf, fieldingOf, pitchingOf, zoneOf, zoneCell, normalizeGames, geom, sampleData, inn2outs, RMAP,
    zipMake, zipRead, exportBundle, restoreBundle, mediaPut, mediaGet, mediaHas, allVideos, dataSig, fname,
    get dir(){ return dirHandle; }, get mode(){ return fsMode; }, scanFolderVideos, probeFolder};
  window.__bbSetDir = (h, m)=>{ dirHandle=h; dirName=h? (h.name||"test"):""; fsNeedGrant=false; _vnames=null; fsMode=h? (m||"rw"):""; };
  window.__bbFolder = ()=>({name:dirName, last:lastFolderSave, err:fsErr, mode:fsMode,
    need:fsNeedGrant, denied:fsDenied, armed:fsAutoArmed, arm:armAutoGrant,
    write:()=>folderWriteJSON(true), read:()=>folderReadJSON(), restore:()=>afterFolderReady(), relink:()=>relinkAll()});
  window.__bbCloseDb = ()=>{ try{ if(_db){ _db.close(); _db=null; } }catch(e){} _vnames=null; return Promise.resolve(); };
})();
</script>
