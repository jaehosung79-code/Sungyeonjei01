/* ------------------------------ 집계 계산 ------------------------------ */
function battingOf(pas){
  const t={PA:0,AB:0,H:0,TB:0,BB:0,HBP:0,SO:0,SF:0,SH:0,RBI:0,R:0,SB:0,CS:0,
           s1:0,s2:0,s3:0,HR:0,GO:0,FO:0,BIP:0,DP:0,ROE:0,FC:0,LO:0};
  pas.forEach(p=>{
    const r = RMAP[p.result]; if(!r) return;
    t.AB+=r.ab||0; t.H+=r.h||0; t.TB+=r.tb||0; t.BB+=r.bb||0; t.HBP+=r.hbp||0;
    t.SO+=r.so||0; t.SF+=r.sf||0; t.SH+=r.sh||0; t.BIP+=r.bip||0;
    if(p.result==="1B") t.s1++; if(p.result==="2B") t.s2++; if(p.result==="3B") t.s3++;
    if(p.result==="HR") t.HR++; if(p.result==="GO") t.GO++; if(p.result==="FO") t.FO++;
    if(p.result==="LO") t.LO++; if(p.result==="DP") t.DP++;
    if(p.result==="ROE") t.ROE++; if(p.result==="FC") t.FC++;
    t.RBI += num(p.rbi,0); t.R += num(p.runs,0); t.SB += num(p.sb,0); t.CS += num(p.cs,0);
  });
  t.PA = t.AB + t.BB + t.HBP + t.SF + t.SH;
  t.AVG = t.AB? t.H/t.AB : null;
  const obDen = t.AB + t.BB + t.HBP + t.SF;
  t.OBP = obDen? (t.H+t.BB+t.HBP)/obDen : null;
  t.SLG = t.AB? t.TB/t.AB : null;
  t.OPS = (t.OBP!=null && t.SLG!=null)? t.OBP+t.SLG : null;
  t.ISO = (t.SLG!=null && t.AVG!=null)? t.SLG-t.AVG : null;
  const bbDen = t.AB - t.SO - t.HR + t.SF;
  t.BABIP = bbDen>0? (t.H-t.HR)/bbDen : null;
  const wDen = t.AB + t.BB + t.SF + t.HBP;
  t.wOBA = wDen? (0.69*t.BB + 0.72*t.HBP + 0.89*t.s1 + 1.27*t.s2 + 1.62*t.s3 + 2.10*t.HR)/wDen : null;
  t.KP  = t.PA? t.SO/t.PA : null;
  t.BBP = t.PA? t.BB/t.PA : null;
  t.SBP = (t.SB+t.CS)? t.SB/(t.SB+t.CS) : null;
  t.BBK = t.SO? t.BB/t.SO : null;                                  // 볼넷/삼진
  t.SecA = t.AB? (t.TB - t.H + t.BB + t.SB - t.CS)/t.AB : null;     // 2차 타율
  t.RC = (t.AB+t.BB+t.HBP)? ((t.H+t.BB+t.HBP)*t.TB)/(t.AB+t.BB+t.HBP) : null;  // 득점 생산(기본형)
  t.ABHR = t.HR? t.AB/t.HR : null;
  t.PSO = t.PA? (t.PA - t.SO)/t.PA : null;                          // 인플레이 전환율
  return t;
}
function fieldingOf(defs){
  const t={outs:0,PO:0,A:0,E:0,DP:0};
  defs.forEach(d=>{ t.outs+=inn2outs(d.innings); t.PO+=num(d.po,0); t.A+=num(d.a,0); t.E+=num(d.e,0); t.DP+=num(d.dp,0); });
  const den = t.PO+t.A+t.E;
  t.FPCT = den? (t.PO+t.A)/den : null;
  t.INN = t.outs/3;
  return t;
}
/* ------------------------------ 투수 집계 ------------------------------ */
/* 투수 기록은 "이닝 하나 = 기록 하나". 총 이닝·ERA·승패는 모두 자동으로 계산됩니다. */
/* FIP 상수 — 리그 평균에 맞춰 보정하는 값. 아마추어 기준 근사값을 씁니다. */
const FIP_C = 3.10;
/* 이 기록의 아웃 카운트 — 새 방식은 이닝별 아웃(0~3), 예전 기록은 이닝 표기(5.2)를 그대로 읽습니다 */
function pitOuts(d){
  const p = d && d.pit; if(!p) return 0;
  if(p.outs!=null && p.outs!=="") return clamp(num(p.outs,0), 0, 3);
  return inn2outs(p.ip || d.innings);
}
function hasPitData(d){
  const p = d && d.pit; if(!p) return false;
  return !!(pitOuts(d) || num(p.tbf,0) || num(p.np,0) || (p.pitches||[]).length
            || num(p.h,0) || num(p.so,0) || num(p.bb,0) || num(p.r,0));
}
function gamePitRecs(g){ return ((g&&g.def)||[]).filter(hasPitData); }
function gamePitOuts(g){ return gamePitRecs(g).reduce((a,d)=>a+pitOuts(d), 0); }

/* ---- 승 · 패 · 세이브 · 홀드 자동 판정 ----
   경기 결과 + 등판 이닝 + 처음/마지막 이닝으로 추정합니다.
   실제 규칙(리드 상황 등)까지는 알 수 없으므로 경기 정보에서 직접 지정할 수 있습니다. */
function autoDecision(g){
  const recs = gamePitRecs(g);
  if(!recs.length) return {dec:"", why:"", auto:true};
  const outs = recs.reduce((a,d)=>a+pitOuts(d), 0);
  const runs = recs.reduce((a,d)=>a+num(d.pit.r,0), 0);
  const inns = recs.map(d=>num(d.inning,0)).filter(x=>x>0);
  const first = inns.length? Math.min.apply(null, inns) : 0;
  const last  = inns.length? Math.max.apply(null, inns) : 0;
  const res = gameResult(g);
  const reg = regInnings(gameLevel(g));
  const need = Math.max(1, Math.ceil(reg/2));
  const started  = first>0 && first<=1;
  const finished = last>0 && last>=reg;
  const ms=num(g.myScore,NaN), os=num(g.oppScore,NaN);
  const margin = (isFinite(ms)&&isFinite(os))? Math.abs(ms-os) : null;
  if(!res) return {dec:"", why:"경기 점수를 입력하면 승패가 자동으로 판정됩니다", auto:true};
  if(res==="무") return {dec:"ND", why:"무승부 — 승패 기록 없음", auto:true};
  if(res==="승"){
    if(started) return outs >= need*3
      ? {dec:"W",  why:`선발 ${fmtInn(outs)}이닝 · 승리 요건(${need}이닝) 충족 · 팀 승리`, auto:true}
      : {dec:"ND", why:`선발 ${fmtInn(outs)}이닝 · 승리 요건(${need}이닝)에 미달`, auto:true};
    if(finished){
      if(margin!=null && margin<=3) return {dec:"SV", why:`구원 등판으로 마지막 이닝 마무리 · ${margin}점 차 승리`, auto:true};
      if(outs>=9) return {dec:"SV", why:`구원 등판 ${fmtInn(outs)}이닝 마무리`, auto:true};
      return {dec:"ND", why:`점수 차가 커 세이브 요건에 해당하지 않습니다`, auto:true};
    }
    return {dec:"HLD", why:`구원 등판 후 교체 · 팀 승리 (리드 유지 가정)`, auto:true};
  }
  if(runs>0) return {dec:"L",  why:`${runs}실점 · 팀 패배`, auto:true};
  return {dec:"ND", why:`무실점 · 팀 패배`, auto:true};
}
/* 경기의 최종 승패 기록 — 직접 지정한 값이 있으면 그것을 씁니다 */
function gameDecision(g){
  if(!g) return {dec:"", why:"", auto:true};
  if(g.pdec) return {dec:g.pdec, why:"경기 정보에서 직접 지정", auto:false};
  return autoDecision(g);
}
function decKo(c){ return PDEC[c||""]||""; }

function pitchingOf(defs){
  const recs = (defs||[]).filter(hasPitData);
  const t = {APP:recs.length, G:0, outs:0, TBF:0, H:0, HR:0, BB:0, HBP:0, SO:0, R:0, ER:0,
             NP:0, ST:0, SW:0, W:0, L:0, SV:0, HLD:0, pitches:[], recs, games:[]};
  const gmap = new Map();
  recs.forEach(d=>{
    const g = d._g || null;
    const key = g? g.id : "_";
    let e = gmap.get(key);
    if(!e){ e = {g, outs:0,TBF:0,H:0,HR:0,BB:0,HBP:0,SO:0,R:0,ER:0,NP:0,ST:0,SW:0,inns:[],pitches:[]}; gmap.set(key,e); }
    const p = d.pit, o = pitOuts(d);
    const list = (p.pitches||[]).map(x=>Object.assign({}, x, {_g:g, _d:d}));
    e.outs+=o; e.TBF+=num(p.tbf,0); e.H+=num(p.h,0); e.HR+=num(p.hr,0);
    e.BB+=num(p.bb,0); e.HBP+=num(p.hbp,0); e.SO+=num(p.so,0);
    e.R+=num(p.r,0); e.ER+=num(p.er,0);
    e.NP += num(p.np,0) || list.length;
    e.ST += num(p.st,0) || list.filter(x=>isStrikeRes(x.r)).length;
    e.SW += list.filter(x=>x.r==="SS").length;
    e.pitches = e.pitches.concat(list);
    if(num(d.inning,0)) e.inns.push(num(d.inning,0));
  });
  t.games = Array.from(gmap.values()).sort((a,c)=>
    (((a.g&&a.g.date)||"")).localeCompare(((c.g&&c.g.date)||"")));
  t.games.forEach(e=>{
    e.ERA = e.outs? e.ER*27/e.outs : null;
    e.WHIP = e.outs? (e.H+e.BB)*3/e.outs : null;
    e.inns.sort((a,c)=>a-c);
    const dd = e.g? gameDecision(e.g) : {dec:"", why:"", auto:true};
    e.dec = dd.dec; e.why = dd.why; e.autoDec = dd.auto;
    if(e.dec && t[e.dec]!=null) t[e.dec] += 1;
    ["outs","TBF","H","HR","BB","HBP","SO","R","ER","NP","ST","SW"].forEach(k=> t[k]+=e[k]);
    t.pitches = t.pitches.concat(e.pitches);
  });
  t.G = t.games.length;
  t.IP = t.outs/3;
  const o = t.outs;
  t.ERA  = o? t.ER*27/o : null;
  t.RA9  = o? t.R*27/o : null;
  t.WHIP = o? (t.H+t.BB)*3/o : null;
  t.K9   = o? t.SO*27/o : null;
  t.BB9  = o? t.BB*27/o : null;
  t.H9   = o? t.H*27/o : null;
  t.HR9  = o? t.HR*27/o : null;
  t.KBB  = t.BB? t.SO/t.BB : null;
  t.FIP  = o? (13*t.HR + 3*(t.BB+t.HBP) - 2*t.SO)*3/o + FIP_C : null;
  t.KP   = t.TBF? t.SO/t.TBF : null;
  t.BBP  = t.TBF? t.BB/t.TBF : null;
  t.KBBP = (t.KP!=null&&t.BBP!=null)? t.KP-t.BBP : null;
  t.AB   = Math.max(0, t.TBF - t.BB - t.HBP);
  t.OAVG = t.AB? t.H/t.AB : null;
  const bd = t.AB - t.SO - t.HR;
  t.OBABIP = bd>0? (t.H-t.HR)/bd : null;
  t.STP  = t.NP? t.ST/t.NP : null;
  t.SWP  = t.NP? t.SW/t.NP : null;
  t.PIP  = o? t.NP*3/o : null;
  t.PPA  = t.TBF? t.NP/t.TBF : null;
  t.EMF  = (t.ERA!=null&&t.FIP!=null)? t.ERA-t.FIP : null;
  return t;
}

function years(){
  const set = new Set(S.games.map(g=>(g.date||"").slice(0,4)).filter(Boolean));
  return Array.from(set).sort().reverse();
}
function scopedGames(){
  const y = S.ui.year, ty = S.ui.gtype||"all";
  const gs = S.games.slice().sort((a,b)=> (a.date||"").localeCompare(b.date||"") || (a.id>b.id?1:-1));
  return gs.filter(g=> (y==="all" || (g.date||"").startsWith(y)) && (ty==="all" || gameType(g)===ty));
}
function gtypeLabel(){ const t=S.ui.gtype||"all"; return t==="all"? "전체 경기" : GAME_TYPES[t].ko; }
function allPAs(gs){ return (gs||scopedGames()).flatMap(g=>g.pas.map(p=>Object.assign({_g:g},p))); }
function allDef(gs){ return (gs||scopedGames()).flatMap(g=>g.def.map(d=>Object.assign({_g:g},d))); }
function curLevel(){ return (S.settings && LEVELS[S.settings.level])? S.settings.level : "high"; }
function gameLevel(g){ return (g && LEVELS[g.level])? g.level : curLevel(); }
function regInnings(lv){
  const k = LEVELS[lv]? lv : curLevel();
  const v = S.settings && S.settings.inningsBy && S.settings.inningsBy[k];
  return (v && isFinite(v) && v>0)? v : LEVELS[k].inn;
}
function hasBIP(code){ return !!(RMAP[code] && RMAP[code].bip); }
const AUTOPLAY = {sound:"소리와 함께", muted:"음소거로", off:"수동"};
function apMode(){ const v=S.settings && S.settings.autoplay; return AUTOPLAY[v]? v : "sound"; }
function gameResult(g){
  const a=num(g.myScore,NaN), b=num(g.oppScore,NaN);
  if(!isFinite(a)||!isFinite(b)) return null;
  return a>b? "승" : a<b? "패" : "무";
}

/* =========================== 차트 (자체 SVG) =========================== */
const TIP = ()=> $("#tip");
function tipShow(el, x, y){
  const t=TIP(); t.innerHTML = el.getAttribute("data-tip");
  t.style.opacity="1";
  const r=t.getBoundingClientRect();
  let left = x - r.width/2, top = y - r.height - 14;
  left = clamp(left, 8, window.innerWidth - r.width - 8);
  if(top < 8) top = y + 18;
  t.style.left=left+"px"; t.style.top=top+"px";
}
function tipHide(){ TIP().style.opacity="0"; }
document.addEventListener("pointerover", e=>{
  const el = e.target.closest && e.target.closest("[data-tip]");
  if(el) tipShow(el, e.clientX, e.clientY); else if(!e.target.closest("#tip")) tipHide();
});
document.addEventListener("pointerdown", e=>{
  const el = e.target.closest && e.target.closest("[data-tip]");
  if(el){ tipShow(el, e.clientX, e.clientY); setTimeout(tipHide, 2600); } else tipHide();
});
document.addEventListener("pointerleave", tipHide);
window.addEventListener("scroll", tipHide, {passive:true});

function niceTicks(min, max, n){
  n = n||4;
  if(min===max){ max = min + 1; }
  const span = max-min, raw = span/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw/mag;
  const step = (norm<=1?1: norm<=2?2: norm<=2.5?2.5: norm<=5?5:10)*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
  const out=[]; for(let v=lo; v<=hi+step/1e6; v+=step) out.push(Math.round(v*1e6)/1e6);
  return out;
}
function rTop(x,y,w,h,r){
  r=Math.min(r, w/2, Math.max(h,0));
  if(h<=0.4) return `M${x},${y} L${x+w},${y}`;
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function rRight(x,y,w,h,r){
  r=Math.min(r, h/2, Math.max(w,0));
  if(w<=0.4) return `M${x},${y} L${x},${y+h}`;
  return `M${x},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h-r} Q${x+w},${y+h} ${x+w-r},${y+h} L${x},${y+h} Z`;
}

/* 꺾은선: 단일/이중 시리즈. pts = [{x, y, tip}] (y=null 허용) */
/* 차트 글자 크기 — 화면에서 카드 설명글(.card .cap, 12px)과 같게 보이도록 맞춥니다.
   SVG는 viewBox(가로 340)가 실제 표시 폭으로 확대·축소되므로,
   그 배율의 역수를 곱해 두면 어느 화면에서나 같은 크기로 보입니다. */
const CH_W = 340, CH_BASE = 10.5, CH_TARGET = 12;   // .card .cap 과 같은 12px
let CFS = CH_BASE, CK = 1;
function calcChartFont(){
  const host = document.getElementById("view");
  const w = host ? host.clientWidth : CH_W;
  const inner = Math.max(220, w - 30);          // 카드 좌우 패딩(14+14)과 테두리
  const cssW = Math.min(620, inner);
  CFS = clamp(CH_TARGET * CH_W / cssW, 6, 20);
  CK = CFS / CH_BASE;
}
function chStyle(extra){ return `style="--cfs:${CFS.toFixed(2)}px${extra?";"+extra:""}"`; }

/* 꺾은선: 단일/이중 시리즈. pts = [{x, y, tip}] (y=null 허용) */
function lineChart(series, opt){
  opt = opt||{};
  const W=CH_W, L=Math.round(38*CK), R=Math.round(18*CK), T=Math.round(12*CK), B=Math.round(26*CK);
  const H=Math.round((opt.height||160) + (B-26) + (T-12));
  const pw=W-L-R, ph=H-T-B;
  const all = series.flatMap(s=>s.pts.map(p=>p.y)).filter(v=>v!=null && isFinite(v));
  if(!all.length) return `<div class="empty">표시할 데이터가 없습니다</div>`;
  let mn = opt.min!=null? opt.min : Math.min.apply(null, all);
  let mx = opt.max!=null? opt.max : Math.max.apply(null, all);
  if(mn===mx){ mn = Math.max(0, mn - 0.05); mx = mx + 0.05; }
  const ticks = niceTicks(mn, mx, 4);
  const t0=ticks[0], t1=ticks[ticks.length-1];
  const n = Math.max(series[0].pts.length, 1);
  const X = i => L + (n===1? pw/2 : pw*i/(n-1));
  const Y = v => T + ph - ph*(v-t0)/(t1-t0);
  const fm = opt.fmt || avg3;
  const dy = CFS*0.34;
  let s = `<svg class="chart" ${chStyle()} viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||"추이 차트")}">`;
  s += `<g>`;
  ticks.forEach(t=>{ s += `<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`
                        + `<text class="ax" x="${L-6}" y="${(Y(t)+dy).toFixed(1)}" text-anchor="end">${fm(t)}</text>`; });
  s += `<line class="bl" x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}"/>`;
  // x축 라벨 — 글자가 커진 만큼 표시 개수를 줄여 겹치지 않게 합니다
  const maxLbl = Math.max(3, Math.floor(pw / (CFS*3.2)));
  const step = Math.max(1, Math.ceil(n/maxLbl));
  series[0].pts.forEach((p,i)=>{ if(i%step===0 || i===n-1)
    s += `<text class="ax" x="${X(i).toFixed(1)}" y="${(H-B+CFS+2).toFixed(1)}" text-anchor="middle">${esc(p.x)}</text>`; });
  series.forEach((ser,si)=>{
    const col = ser.color;
    let d="", started=false;
    ser.pts.forEach((p,i)=>{ if(p.y==null||!isFinite(p.y)){ started=false; return; }
      d += (started? " L":" M") + X(i).toFixed(1)+","+Y(p.y).toFixed(1); started=true; });
    if(d) s += `<path d="${d.trim()}" fill="none" stroke="${col}" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    // 마지막 지점 강조 + 직접 라벨
    let last=-1; ser.pts.forEach((p,i)=>{ if(p.y!=null&&isFinite(p.y)) last=i; });
    if(last>=0){
      const lx=X(last), ly=Y(ser.pts[last].y);
      s += `<circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.5" fill="${col}" stroke="var(--surface-1)" stroke-width="2"/>`;
      const anchor = last===n-1? "end" : "middle";
      s += `<text class="dlbl" x="${lx.toFixed(1)}" y="${(ly-CFS*0.75).toFixed(1)}" text-anchor="${anchor}">${fm(ser.pts[last].y)}</text>`;
    }
    // 히트 영역
    ser.pts.forEach((p,i)=>{ if(p.y==null||!isFinite(p.y)) return;
      s += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="12" fill="transparent" data-tip="${esc(p.tip||"")}"/>`; });
  });
  s += `</g></svg>`;
  return s;
}

/* 세로 막대 */
function colChart(items, opt){
  opt=opt||{};
  if(!items.length) return `<div class="empty">표시할 데이터가 없습니다</div>`;
  const W=CH_W, R=Math.round(12*CK);
  const L=Math.round((opt.left!=null?opt.left:34)*CK);
  const T=Math.round((opt.labelTop?20:14)*CK), B=Math.round((opt.bottom||26)*CK);
  const H=Math.round((opt.height||162) + (B-26) + (T-(opt.labelTop?20:14)));
  const pw=W-L-R, ph=H-T-B;
  const vals = items.map(d=>num(d.value,0));
  const mx = Math.max.apply(null, vals.concat([opt.minMax||1]));
  const ticks = niceTicks(0, mx, 3);
  const t1 = ticks[ticks.length-1];
  const band = pw/items.length;
  const bw = Math.min(24, band*0.62);
  const Y = v => T + ph - ph*v/t1;
  const fm = opt.fmt || (v=> String(Math.round(v*100)/100));
  const dy = CFS*0.34;
  let s = `<svg class="chart" ${chStyle()} viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||"막대 차트")}">`;
  ticks.forEach(t=>{ s += `<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>`
    + `<text class="ax" x="${L-6}" y="${(Y(t)+dy).toFixed(1)}" text-anchor="end">${fm(t)}</text>`; });
  s += `<line class="bl" x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}"/>`;
  // 라벨이 겹칠 만큼 항목이 많으면 건너뛰며 표시
  const lstep = Math.max(1, Math.ceil(items.length / Math.max(3, Math.floor(pw/(CFS*2.6)))));
  items.forEach((d,i)=>{
    const v=num(d.value,0), x=L+band*i+(band-bw)/2, y=Y(v), h=T+ph-y;
    const col = d.color || opt.color || "var(--chart)";
    if(v>0) s += `<path d="${rTop(x, y, bw, h, 4)}" fill="${col}"/>`;
    s += `<rect x="${(L+band*i+1).toFixed(1)}" y="${T}" width="${(band-2).toFixed(1)}" height="${ph}" fill="transparent" data-tip="${esc(d.tip||(d.label+": "+fm(v)))}"/>`;
    if(i%lstep===0 || i===items.length-1)
      s += `<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${(H-B+CFS+1).toFixed(1)}" text-anchor="middle">${esc(d.label)}</text>`;
    if(opt.labelTop && v>0) s += `<text class="dlbl" x="${(x+bw/2).toFixed(1)}" y="${(y-CFS*0.42).toFixed(1)}" text-anchor="middle">${fm(v)}</text>`;
  });
  s += `</svg>`;
  return s;
}

/* 가로 막대 */
function hbarChart(items, opt){
  opt=opt||{};
  if(!items.length) return `<div class="empty">표시할 데이터가 없습니다</div>`;
  const W=CH_W, rowH=Math.round((opt.rowH||22)*CK), L=Math.round((opt.left||64)*CK), R=Math.round(34*CK), T=4;
  const H = T + items.length*rowH + 4;
  const pw = W-L-R;
  const mx = Math.max.apply(null, items.map(d=>num(d.value,0)).concat([1]));
  const bh = Math.min(Math.round(14*CK), rowH-Math.round(8*CK));
  const fm = opt.fmt || (v=>String(v));
  const dy = CFS*0.34;
  let s = `<svg class="chart" ${chStyle()} viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||"막대 차트")}">`;
  items.forEach((d,i)=>{
    const v=num(d.value,0), y=T+i*rowH+(rowH-bh)/2, w=pw*v/mx;
    const col=d.color||opt.color||"var(--chart)";
    s += `<text class="ax" x="${L-8}" y="${(y+bh/2+dy).toFixed(1)}" text-anchor="end">${esc(d.label)}</text>`;
    s += `<line class="gl" x1="${L}" x2="${L+pw}" y1="${(y+bh/2).toFixed(1)}" y2="${(y+bh/2).toFixed(1)}" opacity=".45"/>`;
    if(v>0) s += `<path d="${rRight(L, y, w, bh, 4)}" fill="${col}"/>`;
    s += `<text class="dlbl" x="${(L+w+6).toFixed(1)}" y="${(y+bh/2+dy).toFixed(1)}">${fm(v)}</text>`;
    s += `<rect x="${L}" y="${(T+i*rowH).toFixed(1)}" width="${pw}" height="${rowH}" fill="transparent" data-tip="${esc(d.tip||(d.label+": "+fm(v)))}"/>`;
  });
  s += `</svg>`;
  return s;
}

/* --------------------------- 야구장 좌표계 --------------------------- */
/* 캔버스는 고정(320x300). 모든 규격이 "같은 배율(1m = 같은 픽셀)"을 쓰므로
   초등 구장은 실제로 작게, 대학·성인 구장은 크게 그려집니다.
   배율 기준은 가장 큰 규격(중앙 펜스)이 캔버스 끝(R)에 닿도록 잡습니다. */
const FIELD = {W:320, H:300, hx:160, hy:270, R:212};
const MAX_CF = Math.max.apply(null, LEVEL_KEYS.map(k=>LEVELS[k].cf));   // 122m (대학·성인)
const UPM = FIELD.R / MAX_CF;                                          // 1m 당 픽셀 (모든 규격 공통)
function geom(lv){
  const L = LEVELS[lv] || LEVELS.high;
  const u = UPM;
  return {L, u, cfU:L.cf*u, lfU:L.lf*u, baseU:L.base*u, moundU:L.mound*u,
          inU:L.base*u*1.47, dirtU:L.base*u*1.62};
}
function fenceR(g, ang){
  const t = Math.abs(ang)/(Math.PI/4);
  return g.cfU + (g.lfU - g.cfU)*t*t;
}
function polar(g, ang, dist){
  return [FIELD.hx + Math.sin(ang)*dist, FIELD.hy - Math.cos(ang)*dist];
}
function fencePath(g){
  const pts=[]; const N=48, A=Math.PI/4;
  for(let i=0;i<=N;i++){ const ang=-A + 2*A*i/N; const p=polar(g, ang, fenceR(g,ang)); pts.push(p[0].toFixed(1)+" "+p[1].toFixed(1)); }
  return pts;
}
function arcPath(g, radius){
  const pts=[]; const N=32, A=Math.PI/4;
  for(let i=0;i<=N;i++){ const ang=-A + 2*A*i/N; const p=polar(g, ang, radius); pts.push(p[0].toFixed(1)+" "+p[1].toFixed(1)); }
  return "M "+pts.join(" L ");
}
/* 규격별 외야 담장 안내선 (비교용) */
function refFence(lv){
  const g = geom(lv);
  return `<path d="M ${fencePath(g).join(" L ")}" fill="none" stroke="var(--axis)" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/>`;
}
/* 홈에서의 거리 눈금 (20m 간격) — k는 표시 배율 보정(잘라낸 그림에서 글자가 커지지 않게) */
function distRuler(g, k){
  k = k || 1;
  let s="";
  const fs = (9*k).toFixed(1), sw = (0.9*k).toFixed(2);
  for(let m=20; m<=Math.round(g.L.cf); m+=20){
    const r = m*g.u;
    if(r > fenceR(g, 0)-4) break;
    s += `<path d="${arcPath(g, r)}" fill="none" stroke="var(--axis)" stroke-width="${sw}" stroke-dasharray="${(2*k).toFixed(1)} ${(5*k).toFixed(1)}" opacity=".65"/>`;
    const pp = polar(g, -Math.PI/4*0.88, r);
    s += `<text x="${pp[0].toFixed(1)}" y="${(pp[1]-2*k).toFixed(1)}" text-anchor="middle" fill="var(--text-3)" `
      + `stroke="var(--surface-1)" stroke-width="${(2.4*k).toFixed(1)}" paint-order="stroke" style="font-size:${fs}px">${m}m</text>`;
  }
  return s;
}
/* 표시 영역 — fit이면 구장(+표시할 점)에 딱 맞게 잘라 빈 공간을 없앱니다 */
function fieldVB(g, opt){
  if(!opt.fit) return {x:0, y:0, w:FIELD.W, h:FIELD.H};
  const m = 10;
  let half = g.lfU*Math.SQRT1_2 + m;
  let y0 = FIELD.hy - g.cfU - m;
  const y1 = FIELD.hy + 18;
  (opt.include||[]).forEach(q=>{
    half = Math.max(half, Math.abs(q.x - FIELD.hx) + 9);
    y0 = Math.min(y0, q.y - 9);
  });
  return {x:+(FIELD.hx-half).toFixed(1), y:+y0.toFixed(1), w:+(half*2).toFixed(1), h:+(y1-y0).toFixed(1)};
}
function fieldSVG(inner, opt){
  opt=opt||{};
  const g = geom(opt.level || curLevel());
  const F = FIELD;
  const vb = fieldVB(g, opt);
  const fence = fencePath(g);
  const fair = `M ${F.hx} ${F.hy} L ` + fence.join(" L ") + " Z";
  const b = g.baseU/Math.SQRT2;
  const p1=[F.hx+b, F.hy-b], p2=[F.hx, F.hy-g.baseU*Math.SQRT2], p3=[F.hx-b, F.hy-b];
  let s = `<svg class="chart" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" data-vb="${vb.x} ${vb.y} ${vb.w} ${vb.h}" role="img" aria-label="${esc(opt.aria||"타구 방향 차트")}" `
        + `style="max-width:${opt.maxw||400}px"${opt.id?` id="${opt.id}"`:""}>`;
  if(opt.ref && g.L.cf < MAX_CF){
    LEVEL_KEYS.filter(k=>LEVELS[k].cf > g.L.cf).forEach(k=>{ s += refFence(k); });
  }
  s += `<path d="${fair}" fill="var(--field)"/>`;
  s += `<path d="${arcPath(g, g.dirtU)} L ${F.hx} ${F.hy} Z" fill="var(--dirt)"/>`;
  s += `<path d="M ${fence.join(" L ")}" fill="none" stroke="var(--axis)" stroke-width="1.5"/>`;
  [ -1, 1 ].forEach(sg=>{ const p=polar(g, sg*Math.PI/4, fenceR(g, Math.PI/4));
    s += `<line x1="${F.hx}" y1="${F.hy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--axis)" stroke-width="1"/>`; });
  s += `<path d="M ${F.hx} ${F.hy} L ${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} L ${p3[0].toFixed(1)} ${p3[1].toFixed(1)} Z" fill="none" stroke="var(--fieldline)" stroke-width="1.5"/>`;
  [[F.hx,F.hy],p1,p2,p3].forEach(p=>{ s += `<rect x="${(p[0]-3).toFixed(1)}" y="${(p[1]-3).toFixed(1)}" width="6" height="6" fill="var(--surface-1)" stroke="var(--fieldline)" stroke-width="1" transform="rotate(45 ${p[0].toFixed(1)} ${p[1].toFixed(1)})"/>`; });
  s += `<circle cx="${F.hx}" cy="${(F.hy-g.moundU).toFixed(1)}" r="${Math.max(5,g.baseU*0.12).toFixed(1)}" fill="var(--dirt)" stroke="var(--fieldline)" stroke-width="1"/>`;
  [-15,15].forEach(a=>{ const rad=a*Math.PI/180; const p=polar(g, rad, fenceR(g,rad));
    s += `<line x1="${F.hx}" y1="${F.hy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--fieldline)" stroke-width="1" opacity=".55"/>`; });
  s += `<path d="${arcPath(g, g.inU)}" fill="none" stroke="var(--fieldline)" stroke-width="1" opacity=".7"/>`;
  if(opt.ruler) s += distRuler(g, vb.w/FIELD.W);
  if(opt.label){
    const kk = vb.w/FIELD.W;
    s += `<text x="${F.hx}" y="${(F.hy-g.cfU-6*kk).toFixed(1)}" text-anchor="middle" fill="var(--text-2)" style="font-size:${(10*kk).toFixed(1)}px;font-weight:650">${esc(g.L.ko)}</text>`;
  }
  s += inner||"";
  s += `</svg>`;
  return s;
}
function zoneOf(pt, lv){
  if(!pt) return null;
  const g = geom(lv || curLevel());
  const dx = pt.x - FIELD.hx, dy = FIELD.hy - pt.y;
  const dist = Math.hypot(dx,dy);
  const ang = Math.atan2(dx, Math.max(dy,0.001))*180/Math.PI;
  const dir = ang < -15? "좌" : ang > 15? "우" : "중";
  const depth = dist < g.inU? "내야" : "외야";
  const label = depth==="외야"? ({"좌":"좌익","중":"중견","우":"우익"})[dir] : "내야 "+dir+"측";
  return {dir, depth, label, dist, ang, m: dist/g.u};
}
/* 페어 지역 판정. 담장·파울선 바로 밖(홈런성 타구 등)은 약간의 여유를 두고
   받아들인 뒤 clampFair가 담장 위로 붙여 줍니다. 그 밖의 클릭은 무시합니다. */
function insideFair(x, y, lv){
  const g = geom(lv || curLevel());
  const dx = x - FIELD.hx, dy = FIELD.hy - y;
  if(dy <= 1) return false;
  const ang = Math.atan2(dx, dy);
  if(Math.abs(ang) > 47*Math.PI/180) return false;
  const d = Math.hypot(dx, dy);
  return d >= g.baseU*0.10 && d <= fenceR(g, Math.min(Math.abs(ang), Math.PI/4)) + 14;
}
function clampFair(x, y, lv){
  const g = geom(lv || curLevel());
  const F = FIELD;
  let dx = x - F.hx, dy = F.hy - y;
  if(dy < 2) dy = 2;
  let ang = clamp(Math.atan2(dx, dy), -44*Math.PI/180, 44*Math.PI/180);
  const dist = clamp(Math.hypot(dx,dy), g.baseU*0.18, fenceR(g, ang)-3);
  const p = polar(g, ang, dist);
  return {x:+p[0].toFixed(1), y:+p[1].toFixed(1), z2:1};
}
function paClass(code){
  if(code==="HR"||code==="2B"||code==="3B") return "xbh";
  if(code==="1B") return "hit";
  if(RMAP[code] && RMAP[code].g==="onbase") return "ob";
  return "out";
}
const SPRAY_COLOR = {hit:"var(--s1)", xbh:"var(--s2)", out:"var(--neutral)", ob:"var(--s3)"};
const SPRAY_LABEL = {hit:"단타", xbh:"장타(2·3루타·홈런)", out:"인플레이 아웃", ob:"출루(실책·야선)"};

/* 타구 마커 크기 (viewBox 320 기준 반지름) */
const SPRAY_R = 2.5;
function sprayChart(pas, lv, opt){
  opt = opt || {};
  const pts = pas.filter(p=>p.zone && RMAP[p.result] && RMAP[p.result].bip);
  if(!pts.length) return `<div class="empty">타구 위치가 기록된 타석이 없습니다<br><span class="hint">타석을 기록할 때 야구장을 눌러 타구 위치를 남겨보세요</span></div>`;
  const fopt = {aria:"타구 방향 산점도", level:lv, ruler:!!opt.ruler, fit:true, include:pts.map(p=>p.zone)};
  const R = (opt.r||SPRAY_R).toFixed(2), SW = "1";
  let inner="";
  ["out","ob","hit","xbh"].forEach(cls=>{
    pts.filter(p=>paClass(p.result)===cls).forEach(p=>{
      const z = zoneOf(p.zone, p._g? gameLevel(p._g) : lv);
      const tip = `<b>${esc(RMAP[p.result].ko)}</b><br>${esc(fmtDate(p._g? p._g.date : ""))} ${p.inning?p.inning+"회":""}<br>${esc(z.label)} · 약 ${Math.round(z.m)}m`;
      inner += `<circle cx="${p.zone.x.toFixed(1)}" cy="${p.zone.y.toFixed(1)}" r="${R}" fill="${SPRAY_COLOR[cls]}" stroke="var(--surface-1)" stroke-width="${SW}" data-tip="${esc(tip)}"/>`;
      // 누르기 쉽도록 보이지 않는 여유 영역
      inner += `<circle cx="${p.zone.x.toFixed(1)}" cy="${p.zone.y.toFixed(1)}" r="${(R*3).toFixed(2)}" fill="transparent" data-tip="${esc(tip)}"/>`;
    });
  });
  const legend = `<div class="legend">`+["xbh","hit","ob","out"].map(c=>
    `<span><i class="dot" style="background:${SPRAY_COLOR[c]}"></i>${SPRAY_LABEL[c]}</span>`).join("")+`</div>`;
  return legend + fieldSVG(inner, fopt);
}

/* --------------------- 스트라이크 존 좌표계 --------------------- */
/* 투수 시점(마운드에서 홈플레이트를 바라본 방향). 캔버스 200x236 고정 —
   저장된 좌표가 어느 화면에서나 같은 자리에 찍힙니다.
   투수 시점에서는 화면 왼쪽이 1루 방향, 오른쪽이 3루 방향입니다. */
const ZONE = {W:200, H:236, x0:52, x1:148, y0:44, y1:172};
function zoneCW(){ return (ZONE.x1-ZONE.x0)/3; }
function zoneCH(){ return (ZONE.y1-ZONE.y0)/3; }
function zoneCell(p){
  if(!p) return -1;
  if(p.x<ZONE.x0 || p.x>ZONE.x1 || p.y<ZONE.y0 || p.y>ZONE.y1) return -1;
  const c = clamp(Math.floor((p.x-ZONE.x0)/zoneCW()),0,2);
  const r = clamp(Math.floor((p.y-ZONE.y0)/zoneCH()),0,2);
  return r*3+c;
}
const ZCELL_KO = ["높은 좌","높은 가운데","높은 우","가운데 좌","한가운데","가운데 우","낮은 좌","낮은 가운데","낮은 우"];
function zoneCellKo(i){ return i<0? "존 밖" : ZCELL_KO[i]; }
/* 존 안쪽 클릭 판정 — 존 주변(볼) 영역까지 허용 */
function insideZone(x,y){ return x>=6 && x<=ZONE.W-6 && y>=6 && y<=ZONE.y1+20; }
function clampZone(x,y){ return {x:+clamp(x,8,ZONE.W-8).toFixed(1), y:+clamp(y,8,ZONE.y1+18).toFixed(1)}; }

function zoneSVG(inner, opt){
  opt=opt||{};
  const Z=ZONE, cw=zoneCW(), ch=zoneCH();
  let s = `<svg class="chart" viewBox="0 0 ${Z.W} ${Z.H}" role="img" aria-label="${esc(opt.aria||"스트라이크 존")}" `
        + `style="max-width:${opt.maxw||300}px"${opt.id?` id="${opt.id}"`:""}>`;
  s += `<rect x="0" y="0" width="${Z.W}" height="${Z.H}" rx="10" fill="var(--surface-2)"/>`;
  s += `<rect x="${Z.x0-13}" y="${Z.y0-13}" width="${Z.x1-Z.x0+26}" height="${Z.y1-Z.y0+26}" rx="4" fill="none" stroke="var(--axis)" stroke-width="1" stroke-dasharray="4 4" opacity=".75"/>`;
  s += `<rect x="${Z.x0}" y="${Z.y0}" width="${Z.x1-Z.x0}" height="${Z.y1-Z.y0}" fill="var(--surface-1)" stroke="var(--text-2)" stroke-width="1.6"/>`;
  for(let i=1;i<3;i++){
    s += `<line x1="${(Z.x0+cw*i).toFixed(1)}" x2="${(Z.x0+cw*i).toFixed(1)}" y1="${Z.y0}" y2="${Z.y1}" stroke="var(--grid)" stroke-width="1"/>`;
    s += `<line x1="${Z.x0}" x2="${Z.x1}" y1="${(Z.y0+ch*i).toFixed(1)}" y2="${(Z.y0+ch*i).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
  }
  const py = Z.y1+30, mx=(Z.x0+Z.x1)/2;
  s += `<path d="M ${mx} ${py} L ${Z.x1-8} ${py+11} L ${Z.x1-8} ${py+19} L ${Z.x0+8} ${py+19} L ${Z.x0+8} ${py+11} Z" fill="var(--surface-1)" stroke="var(--axis)" stroke-width="1.2"/>`;
  s += `<text x="${mx}" y="${py+33}" text-anchor="middle" fill="var(--text-3)" style="font-size:9px">투수 시점 · 왼쪽 = 1루 방향</text>`;
  s += inner||"";
  s += `</svg>`;
  return s;
}
function pitchTip(p){
  return `<b>${esc(PTMAP[p.t]||"구종 미입력")}</b> · ${esc(prKo(p.r))}<br>${esc(zoneCellKo(zoneCell(p)))}`
    + (num(p.v,0)? ` · ${Math.round(num(p.v,0))}km/h` : "")
    + (p._g? `<br>${esc(fmtDate(p._g.date))}${p._d&&num(p._d.inning,0)?" "+num(p._d.inning,0)+"회":""}` : "");
}
function pitchMarks(pitches, opt){
  opt=opt||{};
  const r = opt.r||4.9;                 // 기본 크기 (이전 7에서 30% 축소)
  const sw = (r*0.22).toFixed(2), fs = (r*1.05).toFixed(1);
  return (pitches||[]).map((p,i)=>{
    const col = PRCOLOR[prGroup(p.r)];
    let out = `<circle cx="${num(p.x,0).toFixed(1)}" cy="${num(p.y,0).toFixed(1)}" r="${r}" fill="${col}" fill-opacity="${opt.op!=null?opt.op:0.88}" stroke="var(--surface-1)" stroke-width="${sw}" data-tip="${esc(pitchTip(p))}"/>`;
    out += `<circle cx="${num(p.x,0).toFixed(1)}" cy="${num(p.y,0).toFixed(1)}" r="${(r*2.4).toFixed(1)}" fill="transparent" data-tip="${esc(pitchTip(p))}"/>`;
    if(opt.num) out += `<text x="${num(p.x,0).toFixed(1)}" y="${(num(p.y,0)+r*0.37).toFixed(1)}" text-anchor="middle" fill="#fff" style="font-size:${fs}px;font-weight:700;pointer-events:none">${i+1}</text>`;
    return out;
  }).join("");
}
function zoneLegend(){
  return `<div class="legend">` + ["strike","ball","inplay","hbp"].map(k=>
    `<span><i class="dot" style="background:${PRCOLOR[k]}"></i>${PRLABEL[k]}</span>`).join("") + `</div>`;
}
function zoneScatter(pitches, opt){
  opt=opt||{};
  if(!pitches || !pitches.length) return `<div class="empty">기록된 투구 코스가 없습니다<br><span class="hint">수비 기록에서 포지션을 <b>투수</b>로 고르면 존에 코스를 찍을 수 있습니다</span></div>`;
  let inner="";
  ["ball","strike","inplay","hbp"].forEach(k=>{
    inner += pitchMarks(pitches.filter(p=>prGroup(p.r)===k), {r:opt.r||4.2, op:.82, num:opt.num});
  });
  return zoneLegend() + zoneSVG(inner, {aria:"투구 코스 산점도", maxw:opt.maxw||320});
}
/* 코스 9분할 히트맵 */
function zoneHeat(pitches){
  const cells = Array.from({length:9},()=>0);
  let outside = 0;
  (pitches||[]).forEach(p=>{ const i=zoneCell(p); if(i<0) outside++; else cells[i]++; });
  const tot = (pitches||[]).length || 1;
  const mx = Math.max.apply(null, cells.concat([1]));
  const cw=zoneCW(), ch=zoneCH();
  let inner="";
  cells.forEach((v,i)=>{
    const r=Math.floor(i/3), c=i%3;
    const x=ZONE.x0+cw*c, y=ZONE.y0+ch*r;
    inner += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${cw.toFixed(1)}" height="${ch.toFixed(1)}" fill="var(--chart)" fill-opacity="${(v/mx*0.8).toFixed(2)}" data-tip="${esc(`<b>${ZCELL_KO[i]}</b><br>${v}구 · 전체의 ${pct1(v/tot)}`)}"/>`;
    inner += `<text x="${(x+cw/2).toFixed(1)}" y="${(y+ch/2+4).toFixed(1)}" text-anchor="middle" fill="var(--text-1)" style="font-size:12px;font-weight:650;pointer-events:none">${v}</text>`;
  });
  return {svg: zoneSVG(inner, {aria:"코스별 투구 분포", maxw:320}), cells, outside, tot:(pitches||[]).length};
}

/* 표 보기 토글이 붙은 차트 카드 */
let cardSeq=0;
function chartCard(title, cap, chartHTML, tableHTML){
  const id="tv"+(++cardSeq);
  return `<div class="card">
    <div class="hd"><div style="flex:1"><h3>${esc(title)}</h3>${cap?`<div class="cap">${cap}</div>`:""}</div>
    ${tableHTML?`<button class="btn sm" data-toggle="${id}" aria-expanded="false">표</button>`:""}</div>
    ${chartHTML}
    ${tableHTML?`<div class="tv" id="${id}" hidden>${tableHTML}</div>`:""}
  </div>`;
}
function tableHTML(head, rows, foot){
  return `<div class="tblwrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`
    + `<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody>`
    + (foot?`<tfoot><tr>${foot.map(c=>`<td>${c}</td>`).join("")}</tr></tfoot>`:"")+`</table></div>`;
}

/* ============================== 화면 ============================== */
const METRICS = {avg:{ko:"타율",k:"AVG"}, obp:{ko:"출루율",k:"OBP"}, slg:{ko:"장타율",k:"SLG"}, ops:{ko:"OPS",k:"OPS"}};
const ICON_EDIT = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const ICON_MINUS = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M8 12h8" stroke-linecap="round"/></svg>';
function delBtn(act, attrs, label){
  return `<button class="iconbtn del" data-act="${act}" ${attrs} title="${esc(label)}" aria-label="${esc(label)}">${ICON_MINUS}</button>`;
}

function filterRow(){
  const ys = years();
  const items = [["all","전체"]].concat(ys.map(y=>[y, y.slice(2)+"시즌"]));
  const yseg = ys.length? `<div class="seg" role="group" aria-label="시즌 선택">`
    + items.map(([v,l])=>`<button data-act="year" data-v="${v}" aria-pressed="${S.ui.year===v}">${l}</button>`).join("")
    + `</div>` : "";
  const cur = S.ui.gtype||"all";
  const tseg = `<div class="seg plain right" role="group" aria-label="경기 종류 선택">`
    + [["all","전체"],["official","정식경기"],["practice","연습경기"]]
        .map(([v,l])=>`<button data-act="gtype" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join("")
    + `</div>`;
  return `<div class="filters">${yseg}${tseg}</div>`;
}
function typeBadge(g){
  return gameType(g)==="practice"? `<span class="badge prac">연습</span>` : `<span class="badge off">정식</span>`;
}
function tile(lb, v, sub){
  return `<div class="tile"><div class="lb">${esc(lb)}</div><div class="v">${v}${sub?`<small>${sub}</small>`:""}</div></div>`;
}
function paBadge(code){
  const r=RMAP[code]; if(!r) return "";
  return `<span class="badge ${GBADGE[r.g]}">${r.ko}</span>`;
}
function paLine(p){
  const z = p.zone? zoneOf(p.zone) : null;
  const bits=[];
  if(p.inning) bits.push(p.inning+"회");
  if(z) bits.push(z.label);
  if(num(p.rbi,0)) bits.push(num(p.rbi,0)+"타점");
  if(num(p.runs,0)) bits.push("득점");
  if(num(p.sb,0)) bits.push("도루 "+num(p.sb,0));
  if(num(p.cs,0)) bits.push("도루실패 "+num(p.cs,0));
  if(p.pitcher) bits.push("vs "+p.pitcher);
  return bits.join(" · ");
}

/* ------------------------------- 홈 ------------------------------- */
function viewHome(){
  const gs = scopedGames();
  const pas = allPAs(gs);
  const b = battingOf(pas);
  const f = fieldingOf(allDef(gs));
  const hp = pitchingOf(allDef(gs));
  const m = S.ui.metric, mk = METRICS[m].k;

  if(!S.games.length){
    return `<div class="empty"><span class="big">⚾</span>
      아직 기록이 없습니다.<br>첫 경기를 추가하고 타석을 기록해 보세요.
      <div style="margin-top:12px" class="hint">아래 <b>경기</b> 탭에서 첫 경기를 추가할 수 있습니다.</div></div>`;
  }

  // 누적 지표 추이
  let acc=[], pts=[];
  gs.forEach(g=>{ acc = acc.concat(g.pas); const t=battingOf(acc);
    pts.push({x:fmtDate(g.date).slice(3), y:t[mk], tip:`<b>${esc(fmtDate(g.date))} vs ${esc(g.opponent||"-")}</b><br>누적 ${METRICS[m].ko} ${avg3(t[mk])}<br>${t.H}안타 / ${t.AB}타수`});
  });
  const trendTbl = tableHTML(["경기","상대","누적 "+METRICS[m].ko],
    gs.map((g,i)=>[fmtDate(g.date), esc(g.opponent||"-"), avg3(pts[i].y)]));

  // 최근 10경기 안타
  const recent = gs.slice(-10);
  const hitCols = recent.map(g=>{ const t=battingOf(g.pas);
    return {label:fmtDate(g.date).slice(3), value:t.H,
      tip:`<b>${esc(fmtDate(g.date))} vs ${esc(g.opponent||"-")}</b><br>${t.AB}타수 ${t.H}안타 ${t.RBI}타점<br>타율 ${avg3(t.AVG)}`};
  });

  return filterRow()
  + `<div class="hero">
      <div class="lb">${METRICS[m].ko}</div>
      <div class="fig">${avg3(b[mk])}</div>
      <div class="meta">${gtypeLabel()} ${gs.length}경기 · ${b.PA}타석 ${b.AB}타수 ${b.H}안타 ${b.HR}홈런 ${b.RBI}타점</div>
      <div class="filters" style="margin:12px 0 0"><div class="seg" role="group" aria-label="지표 선택">`
      + Object.keys(METRICS).map(k=>`<button data-act="metric" data-v="${k}" aria-pressed="${m===k}">${METRICS[k].ko}</button>`).join("")
      + `</div></div></div>`
  + `<div class="tiles" style="margin-bottom:12px">`
      + tile("경기", gs.length, "G") + tile("타점", b.RBI) + tile("득점", b.R)
      + tile("볼넷", b.BB) + tile("삼진", b.SO) + tile("도루", b.SB, (b.SB+b.CS)? "/"+(b.SB+b.CS) : "")
    + `</div>`
  + chartCard("누적 "+METRICS[m].ko+" 추이", "경기를 치를수록 지표가 어떻게 수렴하는지 보여줍니다. 마지막 값이 현재 시즌 기록입니다.",
      lineChart([{pts, color:"var(--chart)"}], {aria:"누적 "+METRICS[m].ko+" 추이", fmt:avg3}), trendTbl)
  + chartCard("최근 경기 안타", recent.length+"경기 · 경기당 안타 수",
      colChart(hitCols, {aria:"경기별 안타 수", labelTop:true, fmt:v=>String(Math.round(v))}),
      tableHTML(["경기","상대","타수","안타","타점","타율"], recent.map(g=>{const t=battingOf(g.pas);
        return [fmtDate(g.date), esc(g.opponent||"-"), t.AB, t.H, t.RBI, avg3(t.AVG)];})))
  + `<div class="card"><div class="hd"><div style="flex:1"><h3>최근 경기</h3></div>
      <button class="btn sm" data-act="nav" data-v="games">전체</button></div>
      <div class="list">${gs.slice(-5).reverse().map(gameRow).join("")||`<div class="hint">경기가 없습니다</div>`}</div></div>`
  + (f.INN>0? `<div class="card"><div class="hd"><div style="flex:1"><h3>수비</h3>
      <div class="cap">기록된 수비 이닝 ${fmtInn(f.outs)} · 수비율 ${avg3(f.FPCT)}</div></div></div>
      <div class="tiles">${tile("이닝", fmtInn(f.outs))+tile("자살", f.PO)+tile("보살", f.A)+tile("실책", f.E)+tile("병살", f.DP)+tile("수비율", avg3(f.FPCT))}</div></div>`:"")
  + (hp.APP? `<div class="card"><div class="hd"><div style="flex:1"><h3>투수</h3>
      <div class="cap">${hp.G}경기 ${hp.APP}등판 · ${fmtInn(hp.outs)}이닝${hp.W||hp.L||hp.SV?` · ${hp.W}승 ${hp.L}패${hp.SV?" "+hp.SV+"세":""}`:""}</div></div>
      <button class="btn sm" data-act="nav" data-v="stats">분석</button></div>
      <div class="tiles">${tile("ERA", fx2(hp.ERA))+tile("WHIP", fx2(hp.WHIP))+tile("삼진", hp.SO)+tile("볼넷", hp.BB)+tile("피안타", hp.H)+tile("K/9", fx2(hp.K9))}</div></div>`:"")
  ;
}

function gameRow(g){
  const t = battingOf(g.pas);
  const res = gameResult(g);
  const badge = res? `<span class="badge ${res==="승"?"w":res==="패"?"l":""}">${res}</span>` : "";
  const sc = (g.myScore!==""&&g.myScore!=null&&g.oppScore!==""&&g.oppScore!=null)? `${g.myScore}:${g.oppScore}` : "";
  return `<div class="row" data-act="openGame" data-id="${g.id}">
    <div class="main">
      <div class="t">${typeBadge(g)} ${badge} ${esc(g.opponent||"상대 미입력")} ${sc?`<span style="color:var(--text-3);font-weight:500">${sc}</span>`:""}</div>
      <div class="s">${esc(fmtDate(g.date))}${g.venue?" · "+esc(g.venue):""}${g.videos.length?" · 영상 "+g.videos.length:""}</div>
    </div>
    <div class="r">${t.PA? `${t.AB}타수 ${t.H}안타${t.RBI?" "+t.RBI+"타점":""}<br><span style="color:var(--text-3)">${avg3(t.AVG)}</span>`:`<span style="color:var(--text-3)">타석 미기록</span>`}</div>
  </div>`;
}

  const gs = scopedGames().slice().reverse();
  return `<button class="btn pri block nb" data-act="newGame" style="margin-bottom:12px">+ 새 경기 기록</button>`
  + filterRow()

}

function viewGame(id){
  const g = S.games.find(x=>x.id===id);
  if(!g){ S.ui.gameId=null; return viewGames(); }
  const t = battingOf(g.pas), f = fieldingOf(g.def);
  const gp = pitchingOf(g.def.map(d=>Object.assign({_g:g},d)));
  const gdec = gameDecision(g);
  const res = gameResult(g);
  const pas = g.pas.map(p=>Object.assign({_g:g},p));

  const paList = g.pas.length? g.pas.map((p,i)=>`
    <div class="row" data-act="editPA" data-gid="${g.id}" data-id="${p.id}">
      <div style="width:26px;text-align:center;color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums">${i+1}</div>
      <div class="main"><div class="t">${paBadge(p.result)}</div><div class="s">${esc(paLine(p))||"&nbsp;"}</div></div>

    </div>`).join("") : `<div class="hint">타석 기록이 없습니다. 아래 버튼으로 추가하세요.</div>`;

  const defSorted = g.def.slice().sort((a,b)=> num(a.inning,0)-num(b.inning,0));
  const defList = g.def.length? defSorted.map(d=>{
    const r = DMAP[d.result];
    return `<div class="row" data-act="editDef" data-gid="${g.id}" data-id="${d.id}">
      <div style="width:34px;text-align:center;color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums">${num(d.inning,0)? num(d.inning,0)+"회" : "-"}</div>
      <div class="main"><div class="t">${r?`<span class="badge ${DGBADGE[r.g]}">${dko(d.result)}</span> `:""}<span style="font-weight:500;color:var(--text-2);font-size:13px">${esc(PMAP[d.pos]||d.pos||"-")}</span></div>
        <div class="s">${esc(defLine(d))||"&nbsp;"}</div></div>
      <div class="r" style="color:var(--text-3)">›</div>
    </div>`;}).join("") : `<div class="hint">수비 기록이 없습니다. 아래 버튼으로 추가하세요.</div>`;

  const vidList = g.videos.length? g.videos.map(v=>videoCard(v,g)).join("") : `<div class="hint">등록된 영상이 없습니다.</div>`;

  return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <button class="btn sm" data-act="nav" data-v="games">‹ 경기 목록</button><div class="spacer" style="flex:1"></div>

    <div class="card">
      <div class="hd"><div style="flex:1">
        <h3>${typeBadge(g)} ${res?`<span class="badge ${res==="승"?"w":res==="패"?"l":""}">${res}</span> `:""}${esc(g.opponent||"상대 미입력")}</h3>

      <div class="tiles">${tile("이닝", fmtInn(gp.outs))+tile("피안타", gp.H)+tile("삼진", gp.SO)+tile("볼넷", gp.BB)+tile("실점", gp.R)+tile("자책", gp.ER)}</div>
      <div class="tiles" style="margin-top:8px">${tile("ERA", fx2(gp.ERA))+tile("WHIP", fx2(gp.WHIP))+tile("FIP", fx2(gp.FIP))+tile("K/9", fx2(gp.K9))+tile("투구수", gp.NP||"-")+tile("스트라이크%", pct1(gp.STP))}</div>
      <div style="margin-top:12px">${tableHTML(["이닝","아웃","타자","피안타","볼넷","삼진","실점","자책","투구"],
        gp.recs.slice().sort((a,b)=>num(a.inning,0)-num(b.inning,0)).map(d=>{ const q=d.pit;
          return [(num(d.inning,0)||"-")+"회", pitOuts(d), num(q.tbf,0)||"-", num(q.h,0), num(q.bb,0), num(q.so,0),
                  num(q.r,0), num(q.er,0), (num(q.np,0)||(q.pitches||[]).length)||"-"]; }),
        ["합계", gp.outs+" ("+fmtInn(gp.outs)+"이닝)", gp.TBF||"-", gp.H, gp.BB, gp.SO, gp.R, gp.ER, gp.NP||"-"])}</div>
      ${gp.pitches.length? `<div style="margin-top:12px">${zoneScatter(gp.pitches, {maxw:300})}</div>
        <div class="hint" style="margin-top:6px">점을 누르면 구종·코스가 표시됩니다 · 존 안 ${gp.pitches.filter(x=>zoneCell(x)>=0).length}구 / 존 밖 ${gp.pitches.filter(x=>zoneCell(x)<0).length}구</div>` : ""}
    </div>` : ""}
    <div class="card">
      <div class="hd"><div style="flex:1"><h3>경기 영상</h3><div class="cap">${g.videos.length}개</div></div>
        <button class="btn sm pri nb" data-act="newVideo" data-gid="${g.id}">+ 영상</button></div>
      ${vidList}
    </div>
`;
}

/* ------------------------------- 분석 ------------------------------- */
function viewStats(){
  const gs = scopedGames(), pas = allPAs(gs), b = battingOf(pas), defs = allDef(gs);
  if(!pas.length && !defs.length)
    return filterRow()+`<div class="empty"><span class="big">▮</span>분석할 기록이 없습니다<br><span class="hint">경기와 타석을 기록하면 자동으로 차트가 만들어집니다</span></div>`;

  // 결과 분포
  const dist = RESULTS.map(r=>({label:r.ko, value:pas.filter(p=>p.result===r.c).length,
      color: r.g==="hit"?"var(--chart)": r.g==="onbase"?"var(--s3)":"var(--neutral)"}))
    .filter(d=>d.value>0).sort((a,c)=>c.value-a.value);
  dist.forEach(d=>{ d.tip = `<b>${esc(d.label)}</b><br>${d.value}회 · 전체 타석의 ${pct1(d.value/Math.max(pas.length,1))}`; });

  // 방향 분포 (인플레이 타구)
  const bip = pas.filter(p=>p.zone && hasBIP(p.result));
  const dirs = ["좌","중","우"].map(d=>{
    const g2 = bip.filter(p=>zoneOf(p.zone, gameLevel(p._g)).dir===d);
    const t = battingOf(g2);
    return {label:({"좌":"좌측","중":"중앙","우":"우측"})[d], value:g2.length,
      tip:`<b>${({"좌":"좌측 방향","중":"중앙 방향","우":"우측 방향"})[d]}</b><br>타구 ${g2.length}개 (${pct1(g2.length/Math.max(bip.length,1))})<br>안타 ${t.H}개`, _h:t.H};
  });
  const depth = ["내야","외야"].map(d=>{
    const g2 = bip.filter(p=>zoneOf(p.zone, gameLevel(p._g)).depth===d);
    return {label:d, value:g2.length, tip:`<b>${d} 타구</b><br>${g2.length}개 (${pct1(g2.length/Math.max(bip.length,1))})`};
  });

  // 이닝별
  const maxInn = Math.max(regInnings(curLevel()), ...pas.map(p=>num(p.inning,0)), 1);
  const innings = Array.from({length:Math.min(maxInn,15)},(_,k)=>k+1).map(i=>{
    const t = battingOf(pas.filter(p=>num(p.inning,0)===i));
    return {label:i+"회", value:t.AVG==null?0:t.AVG, _t:t,
      tip:`<b>${i}회</b><br>${t.AB}타수 ${t.H}안타<br>타율 ${avg3(t.AVG)}`};
  }).filter(d=>d._t.PA>0);

  // 월별
  const byMonth = {};
  pas.forEach(p=>{ const m=(p._g.date||"").slice(0,7); if(!m) return; (byMonth[m]=byMonth[m]||[]).push(p); });
  const months = Object.keys(byMonth).sort().map(m=>{ const t=battingOf(byMonth[m]);
    return {label:(+m.slice(5,7))+"월", value:t.AVG==null?0:t.AVG, _t:t,
      tip:`<b>${m.slice(0,4)}년 ${+m.slice(5,7)}월</b><br>${t.AB}타수 ${t.H}안타 ${t.RBI}타점<br>타율 ${avg3(t.AVG)} · OPS ${avg3(t.OPS)}`};
  });

  // 상대 투수별
  const byP = {};
  pas.forEach(p=>{ const k=(p.pitcher||"").trim(); if(!k) return; (byP[k]=byP[k]||[]).push(p); });
  const pitchers = Object.keys(byP).map(k=>({name:k, t:battingOf(byP[k])})).sort((a,c)=>c.t.PA-a.t.PA);

  // 수비 결과 분포
  const defPlays = defs.filter(d=>d.result);
  const defDist = DEF_RESULTS.map(r=>({label:r.sk||r.ko, value:defPlays.filter(d=>d.result===r.c).length,
      color: r.g==="out"?"var(--s3)": r.g==="err"?"var(--crit)":"var(--neutral)"}))
    .filter(d=>d.value>0).sort((a,c)=>c.value-a.value);
  defDist.forEach(d=>{ d.tip = `<b>${esc(d.label)}</b><br>${d.value}회 · 수비 기록의 ${pct1(d.value/Math.max(defPlays.length,1))}`; });

  // 포지션별 수비
  const byPos = {};
  defs.forEach(d=>{ (byPos[d.pos]=byPos[d.pos]||[]).push(d); });
  const posRows = Object.keys(byPos).map(k=>({pos:k, f:fieldingOf(byPos[k])})).sort((a,c)=>c.f.outs-a.f.outs);

  // 타격 — 클래식 지표 (기록지에 그대로 적히는 수치)
  const bClassic = tableHTML(["항목","값","항목 ","값 "],
    [["경기",gs.length,"타율 AVG",avg3(b.AVG)],["타석 PA",b.PA,"출루율 OBP",avg3(b.OBP)],
     ["타수 AB",b.AB,"장타율 SLG",avg3(b.SLG)],["안타 H",b.H,"총루타 TB",b.TB],
     ["2루타",b.s2,"타점 RBI",b.RBI],["3루타",b.s3,"득점 R",b.R],
     ["홈런 HR",b.HR,"볼넷 BB",b.BB],["삼진 SO",b.SO,"몸에 맞는 공",b.HBP],
     ["희생타",b.SF+b.SH,"도루 성공 SB",b.SB],
     ["도루 실패 CS",b.CS,"도루 시도",b.SB+b.CS]]);
  // 타격 — 세이버메트릭스 지표
  const bSaber = tableHTML(["항목","값","항목 ","값 "],
    [["OPS",avg3(b.OPS),"삼진율 K%",pct1(b.KP)],
     ["순장타율 ISO",avg3(b.ISO),"볼넷율 BB%",pct1(b.BBP)],
     ["wOBA",avg3(b.wOBA),"볼넷/삼진 BB/K",fx2(b.BBK)],
     ["BABIP",avg3(b.BABIP),"2차 타율 SecA",avg3(b.SecA)],
     ["득점생산 RC",fx2(b.RC),"인플레이 전환율",pct1(b.PSO)],
     ["타수/홈런 AB/HR",fx2(b.ABHR),"도루 성공률 SB%",pct1(b.SBP)]]);

  return filterRow()
  + `<div class="grid g2">
      <div class="card"><div class="hd"><div style="flex:1"><h3>타격 — 클래식 지표</h3>
        <div class="cap">${S.ui.year==="all"?"전체 기간":S.ui.year+"시즌"} · ${gtypeLabel()} · ${gs.length}경기 ${b.PA}타석</div></div></div>${bClassic}</div>
      <div class="card"><div class="hd"><div style="flex:1"><h3>타격 — 세이버메트릭스</h3>
        <div class="cap">같은 기록을 출루·장타 가치와 결과의 질로 다시 본 지표입니다</div></div></div>${bSaber}</div>
    </div>`
  + ((b.SB+b.CS)? `<div class="card"><div class="hd"><div style="flex:1"><h3>도루</h3>
      <div class="cap">타석 기록에 남긴 도루 시도 ${b.SB+b.CS}회 · 성공률 = 성공 / (성공+실패)</div></div></div>
      <div class="tiles">${tile("시도", b.SB+b.CS)+tile("성공", b.SB)+tile("실패", b.CS)+tile("성공률", pct1(b.SBP))
        +tile("경기당 시도", fx2(gs.length? (b.SB+b.CS)/gs.length : null))+tile("추가 진루", b.SB-b.CS)}</div>
      <div class="hint" style="margin-top:8px">일반적으로 성공률이 <b>70%</b>를 넘어야 팀 득점에 도움이 됩니다 — 그 아래면 시도 자체가 손해일 수 있습니다.</div></div>` : "")
  + chartCard("타구 방향 (스프레이 차트)", `타구 위치가 기록된 인플레이 타구 ${bip.length}개 · 그림은 ${esc(LEVELS[curLevel()].ko)} 규격 (${esc(LEVELS[curLevel()].note)}) · 모든 규격이 같은 배율이라 거리가 그대로 비교됩니다`,
      sprayChart(pas, curLevel(), {ruler:true}),
      bip.length? tableHTML(["날짜","이닝","결과","위치","추정 거리"], bip.map(p=>{const z=zoneOf(p.zone, gameLevel(p._g));
        return [fmtDate(p._g.date), (p.inning||"-")+"회", esc(RMAP[p.result].ko), esc(z.label), Math.round(z.m)+"m"];})) : "")
  + `<div class="grid g2">`
  + chartCard("방향별 타구 수", "당겨치는 성향인지 밀어치는 성향인지 확인합니다",
      colChart(dirs, {aria:"방향별 타구 수", labelTop:true, fmt:v=>String(Math.round(v))}),
      tableHTML(["방향","타구","안타"], dirs.map(d=>[d.label, d.value, d._h])))
  + chartCard("타구 깊이", "내야 / 외야로 나눈 타구 분포",
      colChart(depth, {aria:"타구 깊이 분포", labelTop:true, fmt:v=>String(Math.round(v))}),
      tableHTML(["깊이","타구"], depth.map(d=>[d.label, d.value])))
  + `</div>`
  + chartCard("타석 결과 분포", `총 ${pas.length}타석의 결과별 횟수`,
      hbarChart(dist, {aria:"타석 결과 분포", left:78, fmt:v=>String(Math.round(v))}),
      tableHTML(["결과","횟수","비중"], dist.map(d=>[d.label, d.value, pct1(d.value/Math.max(pas.length,1))])))
  + (innings.length? chartCard("이닝별 타율", `타석이 있었던 이닝만 표시합니다 · ${esc(LEVELS[curLevel()].ko)} 정규 ${regInnings(curLevel())}이닝`,
      colChart(innings, {aria:"이닝별 타율", fmt:avg3}),
      tableHTML(["이닝","타수","안타","타율"], innings.map(d=>[d.label, d._t.AB, d._t.H, avg3(d._t.AVG)]))) : "")
  + (months.length>1? chartCard("월별 타율", "시즌 흐름을 월 단위로 봅니다",
      colChart(months, {aria:"월별 타율", fmt:avg3}),
      tableHTML(["월","타수","안타","타점","타율","OPS"], months.map(d=>[d.label, d._t.AB, d._t.H, d._t.RBI, avg3(d._t.AVG), avg3(d._t.OPS)]))) : "")
  + (pitchers.length? `<div class="card"><div class="hd"><div style="flex:1"><h3>상대 투수별 성적</h3>
      <div class="cap">투수 이름을 입력한 타석만 집계됩니다</div></div></div>
      ${tableHTML(["투수","타석","타수","안타","홈런","삼진","타율","OPS"],
        pitchers.map(p=>[esc(p.name), p.t.PA, p.t.AB, p.t.H, p.t.HR, p.t.SO, avg3(p.t.AVG), avg3(p.t.OPS)]))}</div>` : "")
  + pitchingSection(gs, defs)
  + (defDist.length? chartCard("수비 결과 분포", `결과를 입력한 수비 기록 ${defPlays.length}건`,
      hbarChart(defDist, {aria:"수비 결과 분포", left:82, fmt:v=>String(Math.round(v))}),
      tableHTML(["결과","횟수","비중"], defDist.map(d=>[d.label, d.value, pct1(d.value/Math.max(defPlays.length,1))]))) : "")
  + (posRows.length? `<div class="card"><div class="hd"><div style="flex:1"><h3>포지션별 수비</h3>
      <div class="cap">수비율 = (자살+보살) / (자살+보살+실책)</div></div></div>
      ${tableHTML(["포지션","이닝","자살","보살","실책","병살","수비율"],
        posRows.map(r=>[esc(PMAP[r.pos]||r.pos), fmtInn(r.f.outs), r.f.PO, r.f.A, r.f.E, r.f.DP, avg3(r.f.FPCT)]),
        ["합계", fmtInn(fieldingOf(defs).outs), fieldingOf(defs).PO, fieldingOf(defs).A, fieldingOf(defs).E, fieldingOf(defs).DP, avg3(fieldingOf(defs).FPCT)])}</div>` : "")
  + `<div class="note">타격 지표 — <b>OPS</b> 출루율+장타율 · <b>ISO</b> 장타율−타율(순수 장타력) ·
      <b>wOBA</b> 출루 유형별 가중치를 적용한 종합 타격 지표 · <b>BABIP</b> 인플레이 타구의 안타 비율 ·
      <b>SecA</b> 안타에 의존하지 않은 생산(장타+볼넷+도루) · <b>RC</b> 만들어 낸 득점의 추정값</div>`;
}

/* ---------------------------- 투수 분석 ---------------------------- */
function pitchingSection(gs, defs){
  const pt = pitchingOf(defs);
  if(!pt.APP) return "";

  // 클래식 지표
  const classic = tableHTML(["항목","값","항목 ","값 "],
    [["등판 경기",pt.G,"이닝 IP",fmtInn(pt.outs)],
     ["승 W",pt.W,"패 L",pt.L],
     ["세이브 SV",pt.SV,"홀드 HLD",pt.HLD],
     ["평균자책 ERA",fx2(pt.ERA),"실점 R",pt.R],
     ["자책점 ER",pt.ER,"피안타 H",pt.H],
     ["피홈런 HR",pt.HR,"볼넷 BB",pt.BB],
     ["사구 HBP",pt.HBP,"탈삼진 SO",pt.SO],
     ["상대 타자 TBF",pt.TBF,"투구수 NP",pt.NP||"-"]]);

  // 세이버메트릭스 지표
  const saber = tableHTML(["항목","값","항목 ","값 "],
    [["WHIP",fx2(pt.WHIP),"FIP",fx2(pt.FIP)],
     ["K/9",fx2(pt.K9),"BB/9",fx2(pt.BB9)],
     ["H/9",fx2(pt.H9),"HR/9",fx2(pt.HR9)],
     ["K/BB",fx2(pt.KBB),"K−BB%",pct1(pt.KBBP)],
     ["삼진율 K%",pct1(pt.KP),"볼넷율 BB%",pct1(pt.BBP)],
     ["피안타율 OAVG",avg3(pt.OAVG),"피BABIP",avg3(pt.OBABIP)],
     ["스트라이크%",pct1(pt.STP),"헛스윙%",pct1(pt.SWP)],
     ["이닝당 투구수 P/IP",fx2(pt.PIP),"ERA−FIP",fx2(pt.EMF)]]);

  // 누적 ERA · WHIP 추이 (경기 순서)
  let aO=0, aER=0, aH=0, aBB=0;
  const eraPts=[], whipPts=[], gameRows=[];
  pt.games.forEach(e=>{
    aO+=e.outs; aER+=e.ER; aH+=e.H; aBB+=e.BB;
    const cera = aO? aER*27/aO : null, cwhip = aO? (aH+aBB)*3/aO : null;
    const dt = e.g? e.g.date : "";
    const lb = fmtDate(dt).slice(3);
    eraPts.push({x:lb, y:cera, tip:`<b>${esc(fmtDate(dt))} vs ${esc((e.g&&e.g.opponent)||"-")}</b><br>이 경기 ${fmtInn(e.outs)}이닝 ${e.ER}자책${e.dec? " · "+decKo(e.dec):""}<br>누적 ERA ${fx2(cera)} · WHIP ${fx2(cwhip)}`});
    whipPts.push({x:lb, y:cwhip, tip:`누적 WHIP ${fx2(cwhip)}`});
    gameRows.push([fmtDate(dt), esc((e.g&&e.g.opponent)||"-"), fmtInn(e.outs), e.TBF||"-", e.H, e.BB, e.SO, e.R, e.ER,
      e.NP||"-", esc(e.dec? decKo(e.dec):"-"), fx2(e.ERA)]);
  });

  // 구종별
  const ptypes = PITCH_TYPES.map(x=>{
    const list = pt.pitches.filter(q=>q.t===x.c);
    const st = list.filter(q=>isStrikeRes(q.r)).length;
    const sw = list.filter(q=>q.r==="SS").length;
    return {label:x.ko, value:list.length, _st:st, _sw:sw,
      tip:`<b>${esc(x.ko)}</b><br>${list.length}구 · 전체의 ${pct1(list.length/Math.max(pt.pitches.length,1))}<br>스트라이크 ${pct1(list.length?st/list.length:null)} · 헛스윙 ${pct1(list.length?sw/list.length:null)}`};
  }).filter(x=>x.value>0).sort((a,c)=>c.value-a.value);

  // 투구 결과별
  const pres = PITCH_RES.map(x=>{
    const n = pt.pitches.filter(q=>q.r===x.c).length;
    return {label:x.ko, value:n, color:PRCOLOR[x.g],
      tip:`<b>${esc(x.ko)}</b><br>${n}구 · ${pct1(n/Math.max(pt.pitches.length,1))}`};
  }).filter(x=>x.value>0).sort((a,c)=>c.value-a.value);

  const heat = zoneHeat(pt.pitches);

  return `<div class="card" style="background:var(--surface-2);border-color:transparent">
      <div class="hd" style="margin:0"><div style="flex:1"><h3>투수 분석</h3>
      <div class="cap">${pt.G}경기 ${pt.APP}등판 · ${fmtInn(pt.outs)}이닝 · ERA ${fx2(pt.ERA)} · WHIP ${fx2(pt.WHIP)}${pt.NP? " · "+pt.NP+"구":""}</div></div></div></div>`
  + `<div class="grid g2">
      <div class="card"><div class="hd"><div style="flex:1"><h3>투수 — 클래식 지표</h3>
        <div class="cap">기록지 그대로의 수치 · 이닝은 5.2 = 5이닝 2아웃</div></div></div>${classic}</div>
      <div class="card"><div class="hd"><div style="flex:1"><h3>투수 — 세이버메트릭스</h3>
        <div class="cap">운·수비의 영향을 덜 받는 지표로 다시 본 결과 (FIP 상수 ${FIP_C.toFixed(2)})</div></div></div>${saber}</div>
    </div>`
  + (eraPts.length? chartCard("누적 평균자책 · WHIP 추이", "등판을 거치며 지표가 어떻게 수렴하는지 보여줍니다. 마지막 값이 현재 기록입니다.",
      `<div class="legend"><span><i style="background:var(--chart)"></i>누적 ERA</span><span><i style="background:var(--s1)"></i>누적 WHIP</span></div>`
      + lineChart([{pts:eraPts, color:"var(--chart)"},{pts:whipPts, color:"var(--s1)"}], {aria:"누적 ERA·WHIP 추이", fmt:fx2}),
      tableHTML(["경기","상대","이닝","타자","피안타","볼넷","삼진","실점","자책","투구수","승패","ERA"], gameRows)) : "")
  + (pt.pitches.length? chartCard("투구 코스 (스트라이크 존)", `기록된 ${pt.pitches.length}구 · 존 안 ${pt.pitches.length-heat.outside}구 / 존 밖 ${heat.outside}구 · 점을 누르면 상세가 표시됩니다`,
      zoneScatter(pt.pitches),
      tableHTML(["날짜","구종","결과","코스","구속"], pt.pitches.map(q=>[
        q._g? fmtDate(q._g.date) : "-", esc(PTMAP[q.t]||"-"), esc(prKo(q.r)), esc(zoneCellKo(zoneCell(q))),
        num(q.v,0)? Math.round(num(q.v,0))+"km/h" : "-"]))) : "")
  + (pt.pitches.length? chartCard("코스별 투구 분포 (9분할)", `존 안쪽만 9칸으로 나눈 분포 · 존 밖 ${heat.outside}구 (${pct1(heat.outside/Math.max(heat.tot,1))})`,
      heat.svg,
      tableHTML(["코스","투구","비중"], ZCELL_KO.map((k,i)=>[k, heat.cells[i], pct1(heat.cells[i]/Math.max(heat.tot,1))]).concat([["존 밖", heat.outside, pct1(heat.outside/Math.max(heat.tot,1))]]))) : "")
  + `<div class="grid g2">`
  + (ptypes.length? chartCard("구종별 투구", `구종을 입력한 투구 ${ptypes.reduce((a,x)=>a+x.value,0)}구`,
      hbarChart(ptypes, {aria:"구종별 투구 수", left:76, fmt:v=>String(Math.round(v))}),
      tableHTML(["구종","투구","비중","스트라이크%","헛스윙%"], ptypes.map(x=>[x.label, x.value,
        pct1(x.value/Math.max(pt.pitches.length,1)), pct1(x.value? x._st/x.value:null), pct1(x.value? x._sw/x.value:null)]))) : "")
  + (pres.length? chartCard("투구 결과 분포", `스트라이크 ${pt.ST}구 (${pct1(pt.STP)}) · 볼 ${pt.NP-pt.ST}구`,
      hbarChart(pres, {aria:"투구 결과 분포", left:76, fmt:v=>String(Math.round(v))}),
      tableHTML(["결과","투구","비중"], pres.map(x=>[x.label, x.value, pct1(x.value/Math.max(pt.pitches.length,1))]))) : "")
  + `</div>`
  + `<div class="card"><div class="hd"><div style="flex:1"><h3>경기별 투수 기록</h3>
      <div class="cap">이닝별로 남긴 기록을 경기 단위로 합산했습니다 · 승패는 경기 결과와 등판 이닝으로 자동 판정됩니다</div></div></div>
      ${tableHTML(["날짜","상대","이닝","등판 회","타자","피안타","볼넷","삼진","실점","자책","투구수","승패","ERA"],
        pt.games.map(e=>[fmtDate(e.g? e.g.date:""), esc((e.g&&e.g.opponent)||"-"), fmtInn(e.outs),
          e.inns.length? (e.inns[0]===e.inns[e.inns.length-1]? e.inns[0]+"회" : e.inns[0]+"~"+e.inns[e.inns.length-1]+"회") : "-",
          e.TBF||"-", e.H, e.BB, e.SO, e.R, e.ER, e.NP||"-", esc(e.dec? decKo(e.dec):"-"), fx2(e.ERA)]),
        ["합계","",fmtInn(pt.outs),"",pt.TBF||"-",pt.H,pt.BB,pt.SO,pt.R,pt.ER,pt.NP||"-",`${pt.W}승 ${pt.L}패`,fx2(pt.ERA)])}</div>`
  + `<div class="note">투수 지표 — <b>ERA</b> 9이닝당 자책점 · <b>WHIP</b> 이닝당 출루 허용(피안타+볼넷) ·
      <b>FIP</b> 홈런·볼넷·삼진만으로 계산해 수비·운의 영향을 뺀 방어율 (13·HR + 3·(BB+HBP) − 2·K) ÷ 이닝 + ${FIP_C.toFixed(2)} ·
      <b>ERA−FIP</b> 값이 크면 수비 도움이나 운이 좋았다는 뜻 · <b>K−BB%</b> 삼진율에서 볼넷율을 뺀 제어력 지표 ·
      <b>스트라이크%</b> 전체 투구 중 스트라이크(파울·인플레이 포함) 비율 · <b>헛스윙%</b> 전체 투구 중 헛스윙 비율<br>
      승패 자동 판정 — 선발은 정규이닝의 절반 이상을 던지고 팀이 이기면 <b>승리</b>, 구원은 마지막 이닝을 3점 차 이내로 지키면 <b>세이브</b>,
      중간에 내려가고 팀이 이기면 <b>홀드</b>, 실점 후 팀이 지면 <b>패전</b>으로 봅니다. 실제와 다르면 경기 정보에서 직접 지정하세요.</div>`;
}

function videoCard(v, g, lite){
  const sub = [];
  if(v.kind==="file") sub.push(lite? bytes(v.size) : bytes(v.size)+(v.store==="fs"? " · 저장 폴더" : " · 이 기기에 저장"));
  else sub.push("링크");
  const lt = videoLinkText(v, g);
  if(lt) sub.push(lt);
  return `<div class="vidcard" data-vid="${v.id}">
    <div class="vh">
      <button class="vtitle" data-act="playVideo" data-gid="${g.id}" data-id="${v.id}">
        <span class="tx">${esc(v.title||v.name||"영상")}</span>
      </button>
      ${v.kind==="link"?`<button class="iconbtn sm" data-act="openVideo" data-gid="${g.id}" data-id="${v.id}" title="새 창에서 열기" aria-label="새 창에서 열기">↗</button>`:""}
      ${lite? "" : `<button class="iconbtn sm" data-act="editVideo" data-gid="${g.id}" data-id="${v.id}" title="영상 정보 수정" aria-label="영상 정보 수정">${ICON_EDIT}</button>
      ${delBtn("delVideo", `data-gid="${g.id}" data-id="${v.id}"`, "영상 삭제")}`}
    </div>
    <div class="hint">${esc(sub.join(" · "))}${v.note?" — "+esc(v.note):""}</div>
    <div class="player" style="margin-top:8px"></div>
  </div>`;
}
function viewVideos(){
  const gs = scopedGames().slice().reverse();
  const withV = gs.filter(g=>g.videos.length);
  const total = withV.reduce((a,g)=>a+g.videos.reduce((x,v)=>x+(v.size||0),0),0);
  const cnt = withV.reduce((a,g)=>a+g.videos.length,0);
  return filterRow()
  + `<div class="card"><div class="hd"><div style="flex:1"><h3>영상 보관함</h3>
      <div class="cap">${cnt}개 · 기기 저장 용량 ${bytes(total)}</div></div></div>
      <div id="quota" class="hint">저장 공간 확인 중…</div><div id="missvid"></div></div>`
  + (withV.length? withV.map(g=>{
      const open = openVG.has(g.id);
      return `<div class="card">
        <button class="vgame" data-act="toggleVG" data-id="${g.id}" aria-expanded="${open}">
          <div class="gt">
            <div class="t">${esc(fmtDate(g.date))} vs ${esc(g.opponent||"-")}</div>
            <div class="s">영상 ${g.videos.length}개${g.venue?" · "+esc(g.venue):""}</div>
          </div>
          <span class="chev" aria-hidden="true">▼</span>
        </button>
        <div class="vlist" ${open?"":"hidden"}>
          ${g.videos.map(v=>videoCard(v,g,true)).join("")}
          <div class="btnrow" style="margin-top:4px">
            <button class="btn sm" data-act="openGame" data-id="${g.id}">경기 기록 보기</button>
            <button class="btn sm pri nb" data-act="newVideo" data-gid="${g.id}">+ 영상 추가</button>
          </div>
        </div>
      </div>`;
    }).join("")
    : `<div class="empty"><span class="big">▶</span>등록된 영상이 없습니다<br>
       <span class="hint">경기 상세 화면에서 영상을 추가할 수 있습니다</span></div>`);
}

function bundleHint(){
  const n = S.games.reduce((a,g)=>a+g.videos.filter(v=>v.kind==="file").length,0);
  const sz = S.games.reduce((a,g)=>a+g.videos.filter(v=>v.kind==="file").reduce((x,v)=>x+(v.size||0),0),0);
  const last = (S.backup && S.backup.at)? new Date(S.backup.at).toLocaleString("ko-KR") : "없음";
  const stale = (S.backup && S.backup.sig)? (S.backup.sig !== dataSig()) : true;
  return `전체 백업 예상 크기 <b>${bytes(sz)}</b> (영상 ${n}개) · 마지막 백업: ${last}`
    + (stale? ` <span style="color:var(--warn);font-weight:650">— 백업 이후 바뀐 기록이 있습니다</span>` : "");
}

/* ============================ 시트 / 모달 ============================ */
function openSheet(inner, mount){
  const m = $("#modal");
  m.innerHTML = `<div class="backdrop"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
  document.body.style.overflow = "hidden";
  if(mount) mount(m.querySelector(".sheet"));
  const first = m.querySelector("input,select,textarea,button");
  if(first && window.innerWidth>700) try{ first.focus(); }catch(e){}
}
function closeSheet(){
  $("#modal").innerHTML=""; document.body.style.overflow="";
  if(askResolve){ const f=askResolve; askResolve=null; f(); }
}
let askResolve = null;
function ask(title, msg, opts){
  return new Promise(res=>{
    openSheet(`<div class="sh"><h3>${esc(title)}</h3></div>
      <div class="hint" style="padding:6px 0 14px;line-height:1.6">${msg}</div>
      <div class="sf">${opts.map((o,i)=>`<button class="btn ${o.style||""}" data-ask="${i}">${esc(o.label)}</button>`).join("")}</div>`);
    // 버튼으로 고른 경우에는 취소 처리(askResolve)를 먼저 해제해야 선택값이 그대로 전달됩니다
    $$("#modal [data-ask]").forEach(b=> b.addEventListener("click", ()=>{ askResolve=null; closeSheet(); res(+b.dataset.ask); }));
    // 바깥 클릭으로는 닫지 않습니다 (버튼으로만 선택)
    askResolve = ()=>{ res(-1); };
  });
}
function stepper(id, val, min, max){
  return `<div class="stepper">
    <button type="button" class="stepbtn" data-act="step" data-t="${id}" data-d="-1" aria-label="감소">−</button>
    <input id="${id}" type="number" inputmode="numeric" value="${val}" min="${min==null?0:min}" ${max!=null?`max="${max}"`:""}>
    <button type="button" class="stepbtn" data-act="step" data-t="${id}" data-d="1" aria-label="증가">+</button></div>`;
}

/* ------------------------------ 타석 시트 ------------------------------ */
let draft = null;
let paPaint = null;   // 타석 시트의 타구 위치 다시 그리기
const blobURLs = {}; // 기기에 저장한 영상의 재생 주소 캐시 (두 번째 클릭부터 즉시 재생)
function paSheet(gid, pid){
  const g = S.games.find(x=>x.id===gid); if(!g) return;
  const p = pid? g.pas.find(x=>x.id===pid) : null;
  draft = p? JSON.parse(JSON.stringify(p)) : {id:null, inning:(g.pas.length?num(g.pas[g.pas.length-1].inning,1)+1:1),
    pitcher:"", result:"", zone:null, rbi:0, runs:0, sb:0, cs:0, note:""};
  const pitchers = Array.from(new Set(S.games.flatMap(x=>x.pas.map(y=>y.pitcher)).filter(Boolean)));
  const LV = gameLevel(g);
  const groups = ["hit","onbase","out"].map(gk=>`
    <div class="chipgroup"><div class="gl">${GLABEL[gk]}</div><div class="chips">
      ${RESULTS.filter(r=>r.g===gk).map(r=>`<button type="button" class="chip g-${gk}" data-act="pickResult" data-v="${r.c}"
        aria-pressed="${draft.result===r.c}">${r.ko}</button>`).join("")}
    </div></div>`).join("");

  openSheet(`
    <div class="sh"><h3>${p?"타석 수정":"타석 기록"}</h3>
      <div class="spacer" style="flex:1"></div>
      <button class="iconbtn" data-act="close" aria-label="닫기">✕</button></div>
    <div class="f2">
      <label class="f"><span>이닝 <span style="color:var(--text-3);font-weight:400">/ 정규 ${regInnings(LV)}이닝</span></span>${stepper("pa_inn", clamp(num(draft.inning,1),1,regInnings(LV)+3), 1, regInnings(LV)+3)}</label>
      <label class="f"><span>상대 투수</span><input id="pa_pit" value="${esc(draft.pitcher)}" list="dl_pit" placeholder="이름 (선택)">
        <datalist id="dl_pit">${pitchers.map(o=>`<option value="${esc(o)}">`).join("")}</datalist></label>
    </div>
    <div style="margin-bottom:6px"><span style="display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:550">결과</span>${groups}</div>
    <div class="f" id="pa_zone_wrap" style="margin-bottom:8px" ${hasBIP(draft.result)?"":"hidden"}>
      <span style="display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:550">타구 위치 <span style="color:var(--text-3);font-weight:400">— 경기장 안쪽을 눌러 표시</span></span>
      <div id="pa_field">${fieldSVG(`<g id="zmark"></g>`, {id:"pafield", aria:"타구 위치 선택", maxw:340, level:LV, fit:true, ruler:true})}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <div id="pa_zlabel" class="hint" style="flex:1">${draft.zone? esc(zoneOf(draft.zone, LV).label)+" 방향" : "선택 안 됨"} <span style="opacity:.7">— ${esc(LEVELS[LV].ko)} 규격</span></div>
        <button type="button" class="btn sm" data-act="clearZone">위치 지우기</button>
      </div>
    </div>
    <div class="f2">
      <label class="f"><span>타점</span>${stepper("pa_rbi", num(draft.rbi,0), 0, 4)}</label>
      <label class="f"><span>득점</span>${stepper("pa_run", num(draft.runs,0), 0, 1)}</label>
    </div>
    <div class="f2">
      <label class="f"><span>도루 성공 <span style="color:var(--text-3);font-weight:400">SB</span></span>${stepper("pa_sb", num(draft.sb,0), 0, 4)}</label>
      <label class="f"><span>도루 실패 <span style="color:var(--text-3);font-weight:400">CS · 도루자</span></span>${stepper("pa_cs", num(draft.cs,0), 0, 4)}</label>
    </div>
    <div class="hint" id="pa_sbhint" style="margin:-6px 0 12px">이 타석에서 나간 뒤의 도루 시도를 적습니다 — 성공과 실패를 모두 남기면 성공률이 계산됩니다.</div>
    <label class="f"><span>메모</span><textarea id="pa_note" placeholder="볼카운트, 구종, 느낀 점 등">${esc(draft.note)}</textarea></label>
    <div class="sf">${p? delBtn("delPA", `data-gid="${gid}" data-id="${p.id}"`, "이 타석 삭제") : `<button class="btn" data-act="close">취소</button>`}
      <button class="btn pri" data-act="savePA" data-gid="${gid}" data-id="${p?p.id:""}">저장</button></div>`,
  sheet=>{
    const svg = sheet.querySelector("#pafield");
    const paint = ()=>{
      const gEl = sheet.querySelector("#zmark");
      if(!draft.zone){ gEl.innerHTML=""; sheet.querySelector("#pa_zlabel").textContent="선택 안 됨"; return; }
      gEl.innerHTML = `<circle cx="${draft.zone.x.toFixed(1)}" cy="${draft.zone.y.toFixed(1)}" r="3.75" fill="var(--s2)" stroke="var(--surface-1)" stroke-width="1.25"/>`;
      const z = zoneOf(draft.zone, LV);
      sheet.querySelector("#pa_zlabel").textContent = z.label+" 방향 · 홈에서 약 "+Math.round(z.m)+"m";
    };
    const pick = ev=>{
      const r = svg.getBoundingClientRect();
      const vb = (svg.getAttribute("data-vb")||("0 0 "+FIELD.W+" "+FIELD.H)).split(" ").map(Number);
      const x = vb[0] + (ev.clientX - r.left) * (vb[2] / r.width);
      const y = vb[1] + (ev.clientY - r.top)  * (vb[3] / r.height);
      if(!insideFair(x,y,LV)){ toast("경기장 안쪽(페어 지역)을 눌러 주세요"); return; }
      draft.zone = clampFair(x,y,LV); paint();
    };
    svg.style.cursor="crosshair";
    svg.addEventListener("pointerdown", ev=>{ ev.preventDefault(); pick(ev); });
    paPaint = paint;
    paint();
    // 도루 성공/실패 요약
    const sbEl = sheet.querySelector("#pa_sb"), csEl = sheet.querySelector("#pa_cs"), sbHint = sheet.querySelector("#pa_sbhint");
    const syncSB = ()=>{
      const a = num(sbEl.value,0), c = num(csEl.value,0), tot = a+c;
      sbHint.innerHTML = tot
        ? `도루 시도 <b>${tot}</b>회 · 성공 ${a} / 실패 ${c} · 성공률 <b>${pct1(a/tot)}</b>`
        : "이 타석에서 나간 뒤의 도루 시도를 적습니다 — 성공과 실패를 모두 남기면 성공률이 계산됩니다.";
    };
    [sbEl,csEl].forEach(el=>{ el.addEventListener("input", syncSB); el.addEventListener("change", syncSB); });
    syncSB();
  });
}

  const openDetail = !!(d && !v.result);   // 예전 방식으로 적어 둔 기록은 세부칸을 펼쳐서 보여줌
  const groups = ["out","err","etc"].map(gk=>`

  openSheet(`

      <label class="f"><span>이닝 <span style="color:var(--text-3);font-weight:400">/ 정규 ${regInnings(LV)}이닝</span></span>
        ${stepper("d_inning", clamp(num(v.inning,1)||1,1,regInnings(LV)+3), 1, regInnings(LV)+3)}</label>
    </div>
    <div style="margin-bottom:6px"><span style="display:block;font-size:12.5px;color:var(--text-2);margin-bottom:6px;font-weight:550">수비 결과</span>${groups}</div>

    const sel  = sheet.querySelector("#d_pos");

    const irow = sheet.querySelector("#d_inn_row");
    const sync = ()=>{ const isP = sel.value==="P"; wrap.hidden = !isP; if(irow) irow.hidden = isP; };
    sel.addEventListener("change", sync); sync();
    const innInp = sheet.querySelector("#d_inning"), innTag = sheet.querySelector("#p_inntag");
    if(innInp && innTag){
      const syncInn = ()=>{ innTag.textContent = (num(innInp.value,1)||1)+"회"; };
      innInp.addEventListener("input", syncInn); innInp.addEventListener("change", syncInn); syncInn();
    }

    const svg = sheet.querySelector("#pzfield");
    pPaint = ()=> paintPitchDraft(sheet);
    const pick = ev=>{
      const r = svg.getBoundingClientRect();
      const x = (ev.clientX - r.left) * (ZONE.W / r.width);
      const y = (ev.clientY - r.top)  * (ZONE.H / r.height);
      if(!insideZone(x,y)){ toast("존과 그 주변(위쪽 사각형 영역)을 눌러 주세요"); return; }
      const pt = clampZone(x,y);
      const vel = num((sheet.querySelector("#p_vel").value||"").trim(), 0);
      pdraft.pitches.push({x:pt.x, y:pt.y, t:pdraft.t, r:pdraft.r, v:vel, pv:2});
      pPaint();
    };
    svg.style.cursor = "crosshair";
    svg.addEventListener("pointerdown", ev=>{ ev.preventDefault(); pick(ev); });
    pPaint();
  });
}
/* 투구 마커 다시 그리기 — 마커 · 요약 · 목록 · 투구수/스트라이크 자동 채움 */
function paintPitchDraft(sheet){
  if(!sheet || !pdraft) return;
  const gEl = sheet.querySelector("#pzmark"); if(!gEl) return;
  const list = pdraft.pitches;
  gEl.innerHTML = pitchMarks(list, {num:true, r:5.6, op:.9});
  const np = list.length, st = list.filter(x=>isStrikeRes(x.r)).length;
  const lb = sheet.querySelector("#p_zlabel");
  if(lb) lb.innerHTML = np? `${np}구 · 스트라이크 ${st} (${pct1(st/np)}) · 헛스윙 ${list.filter(x=>x.r==="SS").length}`
                          : "존을 눌러 투구를 기록하세요";
  if(np){
    const a=sheet.querySelector("#p_np"), b=sheet.querySelector("#p_st");
    if(a) a.value = String(np);
    if(b) b.value = String(st);
  }
  const box = sheet.querySelector("#p_list");
  if(box) box.innerHTML = list.map((x,i)=>`<span class="pitem"><span class="no">${i+1}</span>`
    + `<i style="background:${PRCOLOR[prGroup(x.r)]}"></i>`
    + `${esc(PTMAP[x.t]||"구종")} · ${esc(prKo(x.r))}${num(x.v,0)?" · "+Math.round(num(x.v,0)):""}`
    + ` <span style="color:var(--text-3)">${esc(zoneCellKo(zoneCell(x)))}</span>`
    + `<button type="button" data-act="delPitch" data-i="${i}" aria-label="${i+1}번째 투구 삭제">✕</button></span>`).join("");
}
// 수비 기록 한 줄 설명
function defLine(d){
  const bits=[];
  if(hasPitData(d)){
    const p=d.pit, o=pitOuts(d);
    if(o) bits.push(o===3? "3아웃" : o+"아웃");
    if(num(p.h,0))  bits.push("피안타 "+num(p.h,0));
    if(num(p.so,0)) bits.push(num(p.so,0)+"삼진");
    if(num(p.bb,0)) bits.push("볼넷 "+num(p.bb,0));
    if(num(p.r,0)||num(p.er,0)) bits.push(num(p.r,0)+"실점("+num(p.er,0)+"자책)");
    if((p.pitches||[]).length) bits.push((p.pitches||[]).length+"구");
    else if(num(p.np,0)) bits.push(num(p.np,0)+"구");
    if(d.note) bits.push(String(d.note).replace(/\s+/g," ").slice(0,30));
    return bits.join(" · ");
  }
  const o = inn2outs(d.innings);
  if(o) bits.push(fmtInn(o)+"이닝");
  if(num(d.po,0)) bits.push("자살 "+num(d.po,0));
  if(num(d.a,0))  bits.push("보살 "+num(d.a,0));
  if(num(d.e,0))  bits.push("실책 "+num(d.e,0));
  if(num(d.dp,0)) bits.push("병살 "+num(d.dp,0));
  if(d.note) bits.push(String(d.note).replace(/\s+/g," ").slice(0,40));
  return bits.join(" · ");
}

}
function defOptions(g, sel){
  return g.def.slice().sort((a,b)=>num(a.inning,0)-num(b.inning,0))
    .map(d=>`<option value="${d.id}" ${sel===d.id?"selected":""}>${num(d.inning,0)?num(d.inning,0)+"회 · ":""}${esc(PMAP[d.pos]||d.pos||"-")}${d.result?" · "+dko(d.result):""}</option>`).join("");
}

function videoLinkText(v, g){
  if(v.defId){
    const d = g.def.find(x=>x.id===v.defId);
    if(d) return "수비 " + (num(d.inning,0)?num(d.inning,0)+"회 ":"") + (PMAP[d.pos]||d.pos||"") + (d.result?" "+dko(d.result):"");
    return "수비 연결";
  }
  if(v.paId){
    const p = g.pas.find(x=>x.id===v.paId);
    if(p) return "타석 " + (p.inning?p.inning+"회 ":"") + (RMAP[p.result]?RMAP[p.result].ko:"");
    return "타석 연결";
  }
  return "";
}

function ytId(u){ const m=String(u).match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/|\/v\/)([A-Za-z0-9_-]{11})/); return m?m[1]:null; }

/* 링크를 앱 안에서 재생할 수 있는 형태로 바꿔 줍니다. */
function embedFor(url){
  const u  = String(url||"").trim();
  const ap = apMode();
  const auto = ap==="off"? 0 : 1, mute = ap==="muted"? 1 : 0;
  const y = ytId(u);
  if(y) return {kind:"iframe", site:"youtube",
    src:`https://www.youtube.com/embed/${y}?autoplay=${auto}&mute=${mute}&playsinline=1&rel=0`};
  const drive = u.match(/(?:drive|docs)\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([A-Za-z0-9_-]{10,})/);
  if(drive) return {kind:"iframe", site:"drive", src:"https://drive.google.com/file/d/"+drive[1]+"/preview"};
  const vimeo = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(vimeo) return {kind:"iframe", site:"vimeo", src:`https://player.vimeo.com/video/${vimeo[1]}?autoplay=${auto}&muted=${mute}`};
  if(/\.(mp4|webm|ogg|ogv|mov|m4v)(\?|$)/i.test(u)) return {kind:"video", site:"file", src:u};
  return null;
}
function playHint(v, site){
  if(v.kind !== "link") return "";
  const yt = site==="youtube"
    ? `화면이 비어 있다면 유튜브 <b>비공개</b> 영상입니다 — 공개 범위를 <b>일부 공개(미등록)</b>로 바꾸면 재생됩니다. · `
    : "";
  return `<div class="hint" style="margin-top:6px">${yt}<a href="${esc(v.url)}" target="_blank" rel="noopener">새 창에서 열기 ↗</a></div>`;
}
function openVideoTab(gid, vid){
  const g = S.games.find(x=>x.id===gid); if(!g) return;
  const v = g.videos.find(x=>x.id===vid); if(!v) return;
  const url = v.kind==="link"? v.url : blobURLs[v.id];
  if(!url){ toast("먼저 재생을 눌러 영상을 불러와 주세요"); return; }
  let w = null;
  try{ w = window.open(url, "_blank", "noopener,noreferrer"); }catch(e){ w = null; }
  if(!w) toast("브라우저가 새 창을 막았습니다");
}
function playVideo(gid, vid){
  const g = S.games.find(x=>x.id===gid); if(!g) return;
  const v = g.videos.find(x=>x.id===vid); if(!v) return;
  const card = $(`.vidcard[data-vid="${vid}"]`);
  const host = card? $(".player", card) : null;
  const setIcon = ()=>{};   // 재생/정지 아이콘은 쓰지 않습니다
  if(!host) return;

  // 다시 누르면 닫기
  if(host.dataset.on === "1"){
    const cur = $("video", host); if(cur){ try{ cur.pause(); }catch(e){} }
    host.innerHTML = ""; host.dataset.on = "0";
    setIcon();
    return;
  }
  host.dataset.on = "1";
  setIcon();

  const ap = apMode();
  const mountVideo = (src, site) =>{
    const tail = playHint(v, site);
    const attrs = ap==="off"? "" : (ap==="muted"? " autoplay muted" : " autoplay");
    host.innerHTML = `<video controls playsinline preload="auto"${attrs} src="${src}"></video>` + tail;
    const el = $("video", host);
    if(el){
      if(ap==="muted") el.muted = true;
      if(ap!=="off"){ const pr = el.play(); if(pr && pr.catch) pr.catch(()=>{}); }
      el.addEventListener("error", ()=>{
        host.innerHTML = `<div class="hint">이 형식·주소는 앱 안에서 재생할 수 없습니다.</div>` + tail;
      }, {once:true});
    }
  };

  // 링크 영상
  if(v.kind === "link"){
    const em = embedFor(v.url);
    if(!em){
      host.innerHTML = `<div class="hint">이 주소는 앱 안에서 바로 재생할 수 없는 형태입니다. 구글 포토·네이버 클라우드 등 일부 서비스는 외부 재생을 막습니다.</div>` + playHint(v, "other");
      return;
    }
    if(em.kind === "iframe"){

    } else mountVideo(esc(em.src), em.site);

  }

  // 저장 폴더 또는 이 기기에 저장한 파일
  if(blobURLs[v.id]){ mountVideo(blobURLs[v.id], "file"); return; }
