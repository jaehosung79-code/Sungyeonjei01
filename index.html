*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  background:var(--surface-0); color:var(--text-1);
  font-family:var(--font-ui);
  font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit;color:inherit}
a{color:var(--s1)}

/* ---------- app chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--surface-0) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex; align-items:center; gap:10px;
}
.topbar .brand{display:flex;align-items:center;gap:8px;min-width:0}
.topbar .ball{
  width:26px;height:26px;border-radius:50%;flex:0 0 auto;
  background:var(--surface-1); border:1px solid var(--axis); position:relative;
}
.topbar .ball::before,.topbar .ball::after{
  content:""; position:absolute; inset:3px 5px; border:1.5px solid var(--s2);
  border-radius:50%; border-color:transparent var(--s2) transparent transparent;
}
.topbar .ball::after{border-color:transparent transparent transparent var(--s2)}
.topbar h1{font-size:17px}
.topbar .sub{font-size:12px;color:var(--text-3);margin-top:-2px}
.spacer{flex:1}
.iconbtn{
  width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-1); display:grid;place-items:center;cursor:pointer;
  font-size:16px; line-height:1;
}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{display:block}
.iconbtn.del{color:var(--crit);border:0;background:none;flex:0 0 auto}
.iconbtn.del:active{background:none;opacity:.55}
.iconbtn.sm{width:34px;height:34px;border-radius:10px}
.iconbtn.on{background:var(--btn);border-color:var(--btn-ring);color:var(--btn-ink)}

.wrap{max-width:1080px;margin:0 auto;padding:14px 14px 24px}
@media(min-width:820px){ .wrap{padding:20px} }

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:color-mix(in srgb, var(--surface-1) 92%, transparent);
  backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--border);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  background:none;border:0;padding:8px 2px 9px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--text-3);font-size:12px;min-height:var(--nav-h);justify-content:center;
}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);font-weight:650}

/* ---------- cards ---------- */
.card{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);
  padding:14px; margin-bottom:12px; box-shadow:var(--shadow);
}
.card > .hd{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.card h3{font-size:14.5px}
.card .cap{font-size:12px;color:var(--text-3);margin-top:2px;line-height:1.35}
.grid{display:grid;gap:12px}
@media(min-width:760px){ .grid.g2{grid-template-columns:1fr 1fr} }

/* ---------- stat tiles ---------- */
.hero{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--shadow);
}
.hero .lb{font-size:12.5px;color:var(--text-2)}
.hero .fig{font-size:52px;font-weight:680;letter-spacing:-.03em;line-height:1.02;margin:2px 0 4px;color:#E2495B}
.hero .meta{font-size:12.5px;color:var(--text-3)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){ .tiles{grid-template-columns:repeat(6,1fr)} }
.tile{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:9px 10px;
}
.tile .lb{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.tile .v{font-size:19px;font-weight:650;letter-spacing:-.02em}
.tile .v small{font-size:11px;font-weight:500;color:var(--text-3);margin-left:2px}

/* ---------- filter row ---------- */
.filters{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  margin:0 0 12px;
}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{
  border:0;background:none;padding:7px 13px;border-radius:999px;font-size:13px;
  cursor:pointer;color:var(--text-2);white-space:nowrap;min-height:34px;
}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--text-1);font-weight:650;box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* 배경·테두리 없는 필터 — 선택 표시는 아래 네비게이션 바와 같은 방식(색 + 굵기) */
.seg{min-width:0;flex:0 1 auto}
.seg.plain{background:none;padding:0;gap:16px;border-radius:0;flex:0 0 auto;overflow:visible}
.seg.plain button{padding:6px 0;border-radius:0;font-size:12.5px;color:var(--text-3);font-weight:500}
.seg.plain button[aria-pressed="true"]{background:none;box-shadow:none;color:var(--accent-ink);font-weight:650}
.filters .right{margin-left:auto}

/* ---------- buttons / forms ---------- */
.btn{
  border:1px solid var(--border);background:var(--surface-1);color:var(--text-1);
  padding:10px 14px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:550;
  min-height:44px; display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{background:var(--surface-2)}
.btn.pri{background:rgba(255,255,255,.10);border-color:var(--btn-ring);color:#a52a2a;font-weight:500}
.btn.pri:active{filter:brightness(.93)}
.btn.nb{border-color:transparent}
.btn.dan{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:12px;border-radius:10px;font-weight:500}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

label.f{display:block;margin-bottom:12px}
label.f > span{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:5px;font-weight:550}
input,select,textarea{
  width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-1);color:var(--text-1);
  min-height:46px;
}
textarea{min-height:76px;resize:vertical}
input:focus,select,textarea:focus{outline:2px solid color-mix(in srgb,var(--s1) 55%,transparent);outline-offset:1px}
select{outline:none;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-1)}
.stepper button{width:46px;min-height:46px;border:0;background:var(--surface-2);font-size:19px;cursor:pointer;flex:0 0 auto}
.stepper input{border:0;border-radius:0;text-align:center;background:none;font-weight:650;padding:11px 0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--border);background:var(--surface-1);border-radius:999px;
  padding:8px 12px;font-size:13px;cursor:pointer;min-height:38px;
}
.chip[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
.chip.g-hit[aria-pressed="true"]{background:var(--s1);border-color:var(--s1)}
.chip.g-onbase[aria-pressed="true"]{background:var(--s3);border-color:var(--s3)}
.chip.g-out[aria-pressed="true"]{background:var(--neutral);border-color:var(--neutral);color:var(--surface-1)}
.chip.g-dout[aria-pressed="true"]{background:var(--s3);border-color:var(--s3);color:#fff}
.chip.g-derr[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.chip.g-detc[aria-pressed="true"]{background:var(--neutral);border-color:var(--neutral);color:var(--surface-1)}
.chipgroup{margin-bottom:10px}
.chipgroup > .gl{font-size:11.5px;color:var(--text-3);margin-bottom:5px;font-weight:600;letter-spacing:.02em}
/* ---------- 투수 기록 ---------- */
.chip.pt[aria-pressed="true"]{background:var(--text-2);border-color:var(--text-2);color:var(--surface-1)}
.chip.g-pstrike[aria-pressed="true"]{background:var(--s2);border-color:var(--s2);color:#fff}
.chip.g-pball[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.chip.g-pinplay[aria-pressed="true"]{background:var(--s3);border-color:var(--s3);color:#fff}
.chip.g-phbp[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.fieldcmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media(min-width:760px){ .fieldcmp{grid-template-columns:repeat(4,1fr)} }
.fieldcmp figure{margin:0;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--surface-1)}
.fieldcmp figure.on{border-color:var(--btn-ring);background:color-mix(in srgb,var(--btn) 12%,var(--surface-1))}
.fieldcmp figcaption{font-size:12px;font-weight:650;margin-bottom:2px}
.fieldcmp .sub{font-size:11px;color:var(--text-3);line-height:1.35;margin-bottom:4px}
.pblock{border:1px solid var(--border);border-radius:12px;background:var(--surface-1);padding:12px;margin-bottom:12px}
.pblock .gl2{font-size:12.5px;font-weight:650;color:var(--text-2);margin:2px 0 8px}
.pblock .gl2 span{font-weight:400;color:var(--text-3);font-size:11.5px}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pitem{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--surface-2);border-radius:999px;padding:4px 4px 4px 9px;color:var(--text-2)}
.pitem .no{font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums}
.pitem i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pitem button{border:0;background:none;cursor:pointer;color:var(--crit);font-size:13px;line-height:1;padding:2px 5px;min-height:24px}

/* ---------- sheet / modal ---------- */
.backdrop{
  position:fixed;inset:0;background:rgba(11,11,11,.42);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.sheet{
  background:var(--surface-0);width:100%;max-width:620px;
  border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));
  animation:rise .2s cubic-bezier(.2,.9,.3,1);
}
@media(min-width:700px){
  .backdrop{align-items:center}
  .sheet{border-radius:20px;max-height:88vh}
}
.sheet .sh{
  position:sticky;top:0;background:var(--surface-0);z-index:2;
  padding:14px 0 10px;margin-bottom:4px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);
}
.sheet .sh h3{font-size:16px}
.sheet .sf{position:sticky;bottom:0;background:var(--surface-0);padding:12px 0 4px;border-top:1px solid var(--border);display:flex;gap:8px}
.sheet .sf .btn{flex:1}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.row{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:11px 12px;display:flex;gap:10px;align-items:center;cursor:pointer;
}
.row:active{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--text-3);margin-top:1px}
.row .r{text-align:right;font-size:12.5px;color:var(--text-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:650;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.badge.w{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.badge.l{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.badge.hit{background:color-mix(in srgb,var(--s1) 15%,transparent);color:var(--s1)}
.badge.ob{background:color-mix(in srgb,var(--s3) 16%,transparent);color:var(--s3)}
.badge.out{background:var(--surface-2);color:var(--text-3)}
.badge.prac{background:color-mix(in srgb,var(--s2) 15%,transparent);color:var(--s2)}
.badge.off{background:#0C4A60;color:#fff}
details.dtl{border:1px solid var(--border);border-radius:12px;background:var(--surface-1);padding:0 12px;margin-bottom:12px}
details.dtl > summary{cursor:pointer;padding:12px 0;font-size:13px;font-weight:600;color:var(--text-2);list-style:none}
details.dtl > summary::-webkit-details-marker{display:none}
details.dtl > summary::before{content:"▸ ";color:var(--text-3)}
details.dtl[open] > summary::before{content:"▾ "}
details.dtl > .dtlbody{padding-bottom:4px}

.empty{
  text-align:center;padding:34px 18px;color:var(--text-3);font-size:13.5px;
  border:1px dashed var(--axis);border-radius:var(--r);background:var(--surface-1);
}
.empty .big{font-size:30px;display:block;margin-bottom:8px}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
td{font-family:var(--font-ui)}
th{color:var(--text-3);font-weight:600;font-size:11.5px;text-align:right}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:650;border-top:1px solid var(--axis);border-bottom:0}

/* ---------- charts ---------- */
.chart{width:100%;max-width:620px;height:auto;display:block;margin:0 auto;overflow:visible;touch-action:pan-y}
.chart text{font-family:inherit}
.ax{font-size:var(--cfs,10.5px);fill:var(--text-3);font-family:var(--font-ui);font-variant-numeric:tabular-nums}
.gl{stroke:var(--grid);stroke-width:1}
.bl{stroke:var(--axis);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 8px;font-size:12px;color:var(--text-2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
.legend i.dot{border-radius:50%}
.dlbl{font-size:var(--cfs,10.5px);font-weight:650;fill:var(--text-1);font-family:var(--font-ui);font-variant-numeric:tabular-nums}
.tv{margin-top:10px;border-top:1px solid var(--grid);padding-top:8px}
#tip{
  position:fixed;z-index:80;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--text-1);color:var(--surface-1);font-size:12px;line-height:1.4;
  padding:7px 9px;border-radius:8px;max-width:220px;box-shadow:0 4px 14px rgba(0,0,0,.25);
  font-variant-numeric:tabular-nums;
}
#tip b{font-weight:650}

/* ---------- video ---------- */
video{width:100%;border-radius:var(--r-sm);background:#000;display:block}
.vidcard{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;margin-bottom:8px}
.vidcard .vh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.vtitle{
  flex:1;min-width:0;display:flex;align-items:center;text-align:left;
  background:none;border:0;padding:6px 2px;cursor:pointer;font-size:14px;font-weight:600;
  min-height:38px;color:var(--accent-ink);
}
.vtitle .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtitle:active{opacity:.7}
.vgame{
  width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;
  padding:4px 0;text-align:left;color:var(--text-1);min-height:44px;
}
.vgame .gt{flex:1;min-width:0}
.vgame .gt .t{font-size:14.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vgame .gt .s{font-size:12px;color:var(--text-3);margin-top:1px}
.vgame .chev{transition:transform .18s;color:var(--text-3);font-size:13px}
.vgame[aria-expanded="true"] .chev{transform:rotate(180deg)}
.vlist{margin-top:10px;border-top:1px solid var(--grid);padding-top:10px}
.vidcard .vh .t{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ratio{position:relative;padding-top:56.25%;border-radius:var(--r-sm);overflow:hidden;background:#000}
.ratio > *{position:absolute;inset:0;width:100%;height:100%;border:0}
.hint{font-size:12px;color:var(--text-3);line-height:1.45}
.note{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;color:var(--text-2);line-height:1.5}
.bar{height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--s1);border-radius:999px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));
  background:var(--text-1);color:var(--surface-1);padding:10px 16px;border-radius:999px;
  font-size:13px;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:rise .2s;
  pointer-events:none;max-width:calc(100vw - 40px);text-align:center;
}
@media print{ nav.tabs,.topbar .iconbtn{display:none} }

/* =====================================================================
   라인 스타일 디자인 — 민트그레이 바탕 · 테두리 없는 플랫 카드 ·
   얇은 선 아이콘 · 가벼운 타이포. 아래 규칙이 위쪽 기본값을 덮어씁니다.
   ===================================================================== */
body{ font-weight:400; letter-spacing:-.005em }
h1,h2,h3,h4{ font-weight:500; letter-spacing:-.02em }

/* 상단 바 — 선을 없애고 배경에 녹입니다 */
.topbar{
  background:color-mix(in srgb, var(--surface-0) 90%, transparent);
  border-bottom:0;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
  gap:12px;
}
.topbar h1{ font-size:17px; font-weight:500 }
.topbar .sub{ font-size:11.5px; color:var(--text-3); letter-spacing:.01em; margin-top:0 }
.topbar .ball{ background:transparent; border-color:var(--accent) }
.topbar .ball::before,.topbar .ball::after{ border-color:transparent var(--accent) transparent transparent }
.topbar .ball::after{ border-color:transparent transparent transparent var(--accent) }

.iconbtn{
  border-radius:999px; border:1px solid var(--border);
  background:transparent; color:var(--text-2);
}
.iconbtn:active{ background:var(--accent-soft) }
.iconbtn.on{ background:var(--accent-soft); border-color:transparent; color:var(--accent-ink) }
.iconbtn.del{ color:var(--crit) }

.wrap{ padding:16px 16px 28px }

/* 카드 — 테두리·그림자 없이 바탕보다 밝은 면으로만 구분 */
.card,.hero{
  border:0; box-shadow:none; border-radius:var(--r);
  background:var(--surface-1);
  padding:18px 18px; margin-bottom:14px;
}
.card > .hd{ margin-bottom:12px }
.card h3{ font-size:15px; font-weight:500 }
.card .cap{ font-size:12px; color:var(--text-3); line-height:1.45 }

.hero .lb{ font-size:12.5px; color:var(--text-2); letter-spacing:.01em }
.hero .fig{ color:var(--accent); font-weight:400; letter-spacing:-.045em; font-size:56px }
.hero .meta{ color:var(--text-3) }

.tile{ border:0; background:var(--surface-1); border-radius:var(--r-sm); padding:12px 12px }
.tile .lb{ color:var(--text-3); font-size:11px }
.tile .v{ font-weight:500; letter-spacing:-.03em; font-size:20px }

/* 세그먼트 · 칩 — 알약 모양의 얇은 선 */
.seg{ background:var(--surface-2); border-radius:999px; padding:3px }
.seg button{ font-weight:400; color:var(--text-2) }
.seg button[aria-pressed="true"]{
  background:var(--surface-1); color:var(--accent-ink); font-weight:500; box-shadow:none;

<script>
"use strict";
/* =========================================================================
   야구 기록 노트 — 단일 파일 앱
   저장: 기록은 localStorage, 영상 파일은 IndexedDB(브라우저 내부)
   ========================================================================= */

/* ---------------------------- 상수 / 도메인 ---------------------------- */
const KEY = "bb_note_v1";
const THEME_KEY = "bb_note_theme";

// 타석 결과 정의 (ab: 타수, h: 안타, tb: 총루타, bb: 볼넷, hbp: 사구, so: 삼진,
//                 sf: 희생플라이, sh: 희생번트, bip: 인플레이 타구)
const RESULTS = [
  {c:"1B",  ko:"안타",         g:"hit",    ab:1, h:1, tb:1, bip:1},
  {c:"2B",  ko:"2루타",        g:"hit",    ab:1, h:1, tb:2, bip:1},
  {c:"3B",  ko:"3루타",        g:"hit",    ab:1, h:1, tb:3, bip:1},
  {c:"HR",  ko:"홈런",         g:"hit",    ab:1, h:1, tb:4, bip:1},
  {c:"BB",  ko:"볼넷",         g:"onbase", bb:1},
  {c:"IBB", ko:"고의4구",      g:"onbase", bb:1},
  {c:"HBP", ko:"몸에 맞는 공", g:"onbase", hbp:1},
  {c:"ROE", ko:"실책 출루",    g:"onbase", ab:1, bip:1},
  {c:"FC",  ko:"야수 선택",    g:"onbase", ab:1, bip:1},
  {c:"K",   ko:"삼진",         g:"out",    ab:1, so:1},
  {c:"GO",  ko:"땅볼 아웃",    g:"out",    ab:1, bip:1},
  {c:"FO",  ko:"뜬공 아웃",    g:"out",    ab:1, bip:1},
  {c:"LO",  ko:"직선타 아웃",  g:"out",    ab:1, bip:1},
  {c:"DP",  ko:"병살타",       g:"out",    ab:1, bip:1},
  {c:"SF",  ko:"희생 플라이",  g:"out",    sf:1, bip:1},
  {c:"SH",  ko:"희생 번트",    g:"out",    sh:1, bip:1}
];
const RMAP = Object.fromEntries(RESULTS.map(r=>[r.c,r]));
const GLABEL = {hit:"안타 / 장타", onbase:"출루", out:"아웃 · 희생"};
const GBADGE = {hit:"hit", onbase:"ob", out:"out"};

const POS = [
  {c:"P",ko:"투수"},{c:"C",ko:"포수"},{c:"1B",ko:"1루수"},{c:"2B",ko:"2루수"},
  {c:"3B",ko:"3루수"},{c:"SS",ko:"유격수"},{c:"LF",ko:"좌익수"},{c:"CF",ko:"중견수"},
  {c:"RF",ko:"우익수"},{c:"DH",ko:"지명타자"}
];
const PMAP = Object.fromEntries(POS.map(p=>[p.c,p.ko]));

// 경기 종류 (정식 / 연습)
const GAME_TYPES = {official:{ko:"정식경기", short:"정식"}, practice:{ko:"연습경기", short:"연습"}};
const GTYPE_KEYS = ["official","practice"];
function gameType(g){ return (g && GAME_TYPES[g.type])? g.type : "official"; }

// 수비 결과 정의 (po: 자살, a: 보살, e: 실책, dp: 병살)
const DEF_RESULTS = [
  {c:"PO",  ko:"자살 (직접 아웃)",  sk:"자살",      g:"out", po:1},
  {c:"A",   ko:"보살 (송구 아웃)",  sk:"보살",      g:"out", a:1},
  {c:"DP",  ko:"병살 처리",         sk:"병살 처리", g:"out", po:1, a:1, dp:1},
  {c:"NP",  ko:"호수비",            sk:"호수비",    g:"out"},
  {c:"EF",  ko:"포구 실책",         sk:"포구 실책", g:"err", e:1},
  {c:"ET",  ko:"송구 실책",         sk:"송구 실책", g:"err", e:1},
  {c:"EM",  ko:"수비 실수 (기록 없음)", sk:"수비 실수", g:"err"},
  {c:"INN", ko:"이닝 수비 (특이사항 없음)", sk:"이닝 수비", g:"etc"}
];
const DMAP = Object.fromEntries(DEF_RESULTS.map(r=>[r.c,r]));
function dko(code){ const r=DMAP[code]; return r? (r.sk||r.ko) : ""; }
const DGLABEL = {out:"아웃 처리 · 호수비", err:"실책 · 실수", etc:"기타"};
const DGBADGE = {out:"ob", err:"l", etc:"out"};
const DGCHIP  = {out:"g-dout", err:"g-derr", etc:"g-detc"};

/* ------------------- 투수 기록 (구종 · 코스 · 결과) ------------------- */
const PITCH_TYPES = [
  {c:"FB", ko:"직구"}, {c:"TS", ko:"투심"}, {c:"CB", ko:"커브"}, {c:"SL", ko:"슬라이더"},
  {c:"CH", ko:"체인지업"}, {c:"FK", ko:"포크·스플리터"}, {c:"ET", ko:"기타"}
];
const PTMAP = Object.fromEntries(PITCH_TYPES.map(p=>[p.c,p.ko]));
// g: strike(스트라이크로 계산) / ball / inplay / hbp
const PITCH_RES = [
  {c:"CS", ko:"스트라이크",    g:"strike"},
  {c:"SS", ko:"헛스윙",        g:"strike"},
  {c:"F",  ko:"파울",          g:"strike"},
  {c:"B",  ko:"볼",            g:"ball"},
  {c:"HB", ko:"몸에 맞는 공",  g:"hbp"},
  {c:"X",  ko:"인플레이 타구", g:"inplay"}
];
const PRMAP = Object.fromEntries(PITCH_RES.map(p=>[p.c,p]));

// 불러온 기록을 현재 형식에 맞춰 보정
/* 예전 버전은 규격마다 배율이 달랐습니다. 저장된 타구 위치를 같은 거리(m)를 유지한 채
   새 공통 배율 좌표로 옮깁니다. (z2 표시가 있으면 이미 변환된 기록) */
function migrateZone(p, lv){
  const z = p && p.zone;
  if(!z || z.z2) return;
  const L = LEVELS[lv] || LEVELS.high;
  const uOld = FIELD.R / L.cf;                       // 옛 배율
  const dx = z.x - FIELD.hx, dy = FIELD.hy - z.y;
  const dist = Math.hypot(dx, dy);
  const ang = Math.atan2(dx, Math.max(dy, 0.001));
  const m = dist / uOld;                             // 실제 거리(m) — 이 값은 그대로 보존
  const g = geom(lv);
  const r = Math.min(m * g.u, fenceR(g, ang) - 2);
  const np = polar(g, clamp(ang, -44*Math.PI/180, 44*Math.PI/180), Math.max(r, g.baseU*0.18));
  p.zone = {x:+np[0].toFixed(1), y:+np[1].toFixed(1), z2:1};
}
function normalizeGames(list){
  (list||[]).forEach(g=>{
    g.pas=g.pas||[]; g.def=g.def||[]; g.videos=g.videos||[];
    const lv = (g && LEVELS[g.level])? g.level : ((S.settings && LEVELS[S.settings.level])? S.settings.level : "high");
    g.pas.forEach(p=> migrateZone(p, lv));
    if(!GAME_TYPES[g.type]) g.type = "official";
    g.def.forEach(d=>{ if(d.note==null) d.note=""; if(d.result==null) d.result=""; if(d.inning==null) d.inning=0;
      if(d.pit){
        d.pit.pitches = Array.isArray(d.pit.pitches)? d.pit.pitches : [];
        if(d.pit.dec==null) d.pit.dec="";
        // 예전 기록은 포수 시점이었습니다. 같은 코스가 유지되도록 좌우를 뒤집습니다.
        d.pit.pitches.forEach(q=>{ if(q.pv!==2){ q.x = +(ZONE.W - num(q.x,0)).toFixed(1); q.pv = 2; } });
      } });
    if(g.pdec==null){ const pd=g.def.find(d=>d.pit && d.pit.dec); g.pdec = pd? pd.pit.dec : ""; }
    g.videos.forEach(v=>{ if(v.defId==null) v.defId=null; if(v.paId==null) v.paId=null;
      if(v.kind==="file" && !v.store) v.store="idb"; });
  });
  return list;
}

/* --------------------------- IndexedDB (영상) --------------------------- */
const DB_NAME="bb_note_media", STORE="videos", HSTORE="handles";
let _db=null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    if(!("indexedDB" in window)) return rej(new Error("이 브라우저는 파일 저장을 지원하지 않습니다"));
    const rq = indexedDB.open(DB_NAME,2);
    rq.onupgradeneeded = ()=>{ const d=rq.result;
      if(!d.objectStoreNames.contains(STORE))  d.createObjectStore(STORE);
      if(!d.objectStoreNames.contains(HSTORE)) d.createObjectStore(HSTORE); };
    rq.onsuccess = ()=>{ _db=rq.result; res(_db); };
    rq.onerror = ()=> rej(rq.error);
  });
}
function idbPut(id, blob){
  return db().then(d=> new Promise((res,rej)=>{
    const tx=d.transaction(STORE,"readwrite"); tx.objectStore(STORE).put(blob,id);
    tx.oncomplete=res; tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
  }));
}
function idbGet(id){
  return db().then(d=> new Promise((res,rej)=>{
    const rq=d.transaction(STORE,"readonly").objectStore(STORE).get(id);
    rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
  }));
}
function idbDel(id){
  return db().then(d=> new Promise((res,rej)=>{
    const tx=d.transaction(STORE,"readwrite"); tx.objectStore(STORE).delete(id);
    tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
  }));
}
/* 파일 전체를 읽지 않고 존재 여부만 확인합니다 */
function idbHas(id){
  return db().then(d=> new Promise((res,rej)=>{
    const os = d.transaction(STORE,"readonly").objectStore(STORE);
    const rq = os.getKey? os.getKey(id) : os.count(id);
    rq.onsuccess=()=>res(os.getKey? rq.result!=null : rq.result>0);
    rq.onerror=()=>rej(rq.error);
  })).catch(()=>false);
}

/* ask=true 일 때만 권한을 새로 요청합니다 (버튼을 누른 그 순간에만 허용됨).
   queryPermission 을 지원하지 않는 브라우저는 막지 않고 그대로 진행합니다. */
async function ensurePerm(h, mode, ask){
  if(!h) return false;
  if(!h.queryPermission) return true;
  let st = "granted";
  try{ st = await h.queryPermission({mode:mode}); }catch(e){ return true; }
  if(st === "granted") return true;
  if(!ask) return false;
  try{ return (await h.requestPermission({mode:mode})) === "granted"; }
  catch(e){ fsErr = errText(e); return false; }
}
function errText(e){
  if(!e) return "";
  return (e.name? e.name+": " : "") + (e.message || String(e));
}
/* 폴더 선택이 실패한 이유를 사람이 읽을 수 있게 풀어 줍니다 */
function pickErrMsg(e){
  const n = e && e.name;
  if(n === "SecurityError")
    return "브라우저가 폴더 접근을 막았습니다 — 파일을 직접 열지 말고 인터넷 주소(https://…)로 접속해 주세요";
  if(n === "NotAllowedError")
    return "폴더 권한이 거부되었습니다 — 다시 시도하고 '허용'을 눌러 주세요";
  if(n === "TypeError" || n === "NotSupportedError")
    return "이 브라우저는 폴더 지정을 지원하지 않습니다";
  return "폴더를 열지 못했습니다 (" + errText(e) + ")";
}

/* 폴더에 만들 파일 이름 — 한글·공백·특수문자는 저장 장치나 클라우드에 따라
   깨지거나 거부될 수 있어 ASCII로만 만듭니다. 원래 이름은 기록(JSON)에 그대로 남습니다. */
function safeName(s){
  const t = String(s||"video");
  const m = t.match(/\.([A-Za-z0-9]{1,5})$/);
  const ext = m? "."+m[1].toLowerCase() : ".mp4";
  let base = (m? t.slice(0, t.length-m[0].length) : t)
    .replace(/[^A-Za-z0-9._-]+/g,"_").replace(/^[._-]+/,"").replace(/_+/g,"_").replace(/_+$/,"").slice(0,40);
  if(!base) base = "video";
  if(!/[A-Za-z]/.test(base)) base = "video_" + base;      // 한글 이름이 통째로 바뀐 경우
  return base + ext;
}
function nfc(s){ try{ return String(s||"").normalize("NFC"); }catch(e){ return String(s||""); } }

/* 이 폴더에 실제로 쓸 수 있는지 확인합니다.
   삼성 인터넷처럼 폴더 선택은 되지만 쓰기를 거부하는 브라우저가 있어서,
   "읽기 전용"으로라도 연결해 두면 기록·영상을 불러오는 데는 쓸 수 있습니다. */
async function probeFolder(){
  if(!dirHandle) return "";
  if(await folderWriteJSON(true, true)) return "rw";
  try{
    if(dirHandle.entries){ for await (const x of dirHandle.entries()){ break; } }
    else if(dirHandle.values){ for await (const x of dirHandle.values()){ break; } }
    return "ro";
  }catch(e){ fsErr = errText(e); return ""; }
}
/* 쓰기가 막힌 걸 뒤늦게 알게 된 경우 — 한 번만 알려 주고 읽기 전용으로 내려갑니다 */
function downgradeRO(){
  if(fsMode === "ro") return;
  fsMode = "ro";
  try{ hSet("dirMode","ro"); }catch(e){}
  if(!roToldOnce){
    roToldOnce = true;
    toast("이 브라우저는 폴더에 저장할 수 없습니다 — 불러오기 전용으로 씁니다");
  }
}
/* 폴더 지정 — 반드시 사용자의 터치(클릭) 안에서 호출해야 합니다 */
async function pickFolder(){
  if(!FS_DIR_OK){
    toast("이 브라우저는 폴더 지정을 지원하지 않습니다");
    return;
  }
  if(!window.isSecureContext){
    fsErr = "보안 연결이 아님 (" + location.protocol + ")"; render();
    toast("파일을 직접 연 상태에서는 폴더를 쓸 수 없습니다 — 인터넷 주소로 접속해 주세요");
    return;
  }
  let h;
  try{
    h = await window.showDirectoryPicker({id:"bbnote", mode:"readwrite", startIn:"documents"});
  }catch(e){
    if(e && e.name === "AbortError") return;        // 사용자가 취소
    fsErr = errText(e); render();
    toast(pickErrMsg(e));
    return;
  }
  dirHandle = h; dirName = h.name; fsNeedGrant = false; fsDenied = false; fsErr = ""; _vnames = null; fsMode = "";
  // 여기서 권한을 다시 물으면(requestPermission) 방금 쓴 터치 승인이 이미 소진돼
  // 브라우저가 거부하는 경우가 있습니다. 실제로 한 번 써 보고 판단합니다.
  fsMode = await probeFolder();
  if(fsMode !== "rw"){
    // 이 클릭의 승인이 아직 살아 있다면 권한 창이 뜹니다
    if(await ensurePerm(h, "readwrite", true)){
      if(await folderWriteJSON(true, true)) fsMode = "rw";
    }
  }
  if(!fsMode){
    dirHandle = null; dirName = ""; render();
    toast("이 폴더는 읽을 수도 쓸 수도 없습니다 — 다른 폴더를 골라 보세요");
    return;
  }
  try{ await hSet("dir", h); await hSet("dirMode", fsMode); }catch(e){}
  if(fsMode === "ro"){
    await ask("읽기 전용으로 연결했습니다",
      `이 브라우저(삼성 인터넷 등)는 웹에서 폴더에 <b>저장</b>하는 것을 허용하지 않습니다.<br><br>
       그래도 이 폴더에서 <b>기록을 불러오고, 영상 파일을 그대로 재생</b>할 수 있습니다.
       저장은 <b>전체 백업(zip)</b>으로 하시고, 그 파일을 이 폴더에 두면 됩니다.<br><br>
       자동 저장까지 쓰고 싶으면 같은 주소를 <b>크롬</b>으로 열어 주세요.`,
      [{label:"알겠습니다", style:"pri"}]);
  }
  const f = await folderReadJSON();
  if(f && f.games.length && !S.games.length){
    await applyFolderData(f, true);
    toast("폴더에서 " + f.games.length + "경기를 불러왔습니다");
  } else if(f && f.games.length && S.games.length && f.games.length !== S.games.length && fsMode === "rw"){
    const k = await ask("폴더에 기록이 있습니다",
      `폴더의 <b>${f.games.length}경기</b>와 이 기기의 <b>${S.games.length}경기</b> 중 무엇을 쓸까요?`,
      [{label:"폴더 기록 불러오기", style:"pri"},{label:"이 기기 기록으로 덮어쓰기", style:"dan"},{label:"나중에"}]);
    if(k===0) await applyFolderData(f, true);
    else if(k===1) await folderWriteJSON(true);
  } else if(fsMode === "rw"){
    await folderWriteJSON(true);
  }
  await relinkAll();
  render();
  toast("저장 폴더: " + dirName + (fsMode==="ro"? " (불러오기 전용)" : ""));
}
async function forgetFolder(){
  dirHandle=null; dirName=""; fsNeedGrant=false; _vnames=null; fsMode="";
  try{ await hDel("dir"); await hDel("dirMode"); }catch(e){}
  render(); toast("폴더 연결을 해제했습니다 (폴더의 파일은 그대로 있습니다)");
}
/* 브라우저를 새로 열면 폴더 권한이 잠깁니다(크롬 정책). 권한 요청은 반드시
   사용자의 터치 안에서만 가능하므로, 따로 버튼을 누르게 하지 않고
   화면의 "첫 터치"에 슬쩍 얹어 자동으로 다시 연결합니다.
   권한 창에서 [방문할 때마다 허용]을 고르면 그 다음부터는 아예 묻지 않습니다. */
function armAutoGrant(){
  if(!dirHandle || !fsNeedGrant || fsAutoArmed || fsDenied) return;
  if(!dirHandle.requestPermission){ fsNeedGrant = false; return; }
  fsAutoArmed = true;
  const go = async ()=>{
    fsAutoArmed = false;
    if(!dirHandle || !fsNeedGrant) return;
    let ok = false;
    fsAskedOnce = true;
    try{ ok = (await dirHandle.requestPermission({mode:"readwrite"})) === "granted"; }
    catch(e){ fsErr = errText(e); ok = false; }
    if(ok){
      fsNeedGrant = false; fsDenied = false;
      await afterFolderReady(); render();
      toast("저장 폴더를 연결했습니다 · " + dirName);
    } else {
      fsDenied = true; render();
    }
  };
  const once = ()=>{
    document.removeEventListener("pointerdown", once, true);
    document.removeEventListener("keydown", once, true);
    go();                       // 터치 승인이 살아 있는 그 자리에서 바로 요청
  };
  document.addEventListener("pointerdown", once, true);
  document.addEventListener("keydown", once, true);
  document.addEventListener("touchstart", once, {capture:true, passive:true});
}
/* 크롬이 권한을 기억하고 있는 경우(방문할 때마다 허용 / 설치된 앱)에는
   터치 없이도 조용히 다시 열립니다. 실패해도 아무 표시를 하지 않고,
   첫 터치 방식으로 넘어갑니다. */
async function trySilentGrant(h){
  if(!h || !h.requestPermission) return false;
  try{ return (await h.requestPermission({mode:"readwrite"})) === "granted"; }
  catch(e){ return false; }
}
/* ------------------------------ 앱 설치 ------------------------------
   홈 화면에 추가(앱 설치)하면 크롬이 저장 폴더 권한을 계속 기억합니다.
   그러면 앱을 다시 열어도 권한 창이 뜨지 않습니다. */
async function installApp(){
  const e = window.__installEvt;
  if(!e){
    ask("앱으로 설치하기",
      `크롬 메뉴(⋮) → <b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 눌러 주세요.<br><br>
       메뉴에 그 항목이 보이지 않으면, 이 주소를 크롬에서 열었는지와
       <b>https</b> 주소인지 확인해 주세요.`,
      [{label:"알겠습니다", style:"pri"}]);
    return;
  }
  try{
    e.prompt();
    const r = await e.userChoice;
    window.__installEvt = null; window.__installReady = false;
    render();
    if(r && r.outcome === "accepted") toast("설치했습니다 — 홈 화면 아이콘으로 열어 주세요");
  }catch(err){ console.warn(err); }
}
function installState(){
  if(isInstalledApp()) return "installed";
  if(window.__installReady) return "ready";
  return "unknown";
}
/* ---------------------------- 전체 화면 ----------------------------
   홈 화면에 추가(앱 설치)한 경우에는 manifest.json 의 "display":"fullscreen"
   덕분에 상태바까지 숨겨진 채로 열립니다. 브라우저 탭으로 열었을 때도
   같은 화면이 되도록 Fullscreen API 로 맞춰 줍니다.
   전체 화면 전환은 사용자의 터치 안에서만 가능하므로, 설정이 켜져 있으면
   화면의 첫 터치에 얹어 실행합니다. */
const FULL_OK = (typeof document!=="undefined") && !!(document.documentElement.requestFullscreen
  || document.documentElement.webkitRequestFullscreen);
let fsScreenArmed = false;
function displayMode(){
  try{
    for(const m of ["fullscreen","standalone","minimal-ui","browser"])
      if(window.matchMedia("(display-mode: "+m+")").matches) return m;
  }catch(e){}
  return "browser";
}
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement) || displayMode()==="fullscreen";
}
function enterFullscreen(){
  const el = document.documentElement;
  try{
    const p = el.requestFullscreen? el.requestFullscreen({navigationUI:"hide"})
            : el.webkitRequestFullscreen? el.webkitRequestFullscreen() : null;
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}
function exitFullscreen(){
  try{
    const p = document.exitFullscreen? document.exitFullscreen()
            : document.webkitExitFullscreen? document.webkitExitFullscreen() : null;
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}
function toggleFullscreen(){
  if(displayMode()==="fullscreen" && !document.fullscreenElement){
    toast("이미 전체 화면으로 실행 중입니다"); return;
  }
  if(!FULL_OK){ toast("이 브라우저는 전체 화면을 지원하지 않습니다"); return; }
  if(document.fullscreenElement || document.webkitFullscreenElement){
    S.settings.fullscreen = false; exitFullscreen();
  } else {
    S.settings.fullscreen = true; enterFullscreen();
  }
  saveNow();
}
function armFullscreen(){
  if(!FULL_OK || fsScreenArmed) return;
  if(S.settings.fullscreen === false) return;
  if(displayMode() === "fullscreen") return;       // 이미 전체 화면으로 열렸습니다
  if(document.fullscreenElement) return;
  fsScreenArmed = true;
  const once = ()=>{
    document.removeEventListener("pointerdown", once, true);
    document.removeEventListener("keydown", once, true);
    fsScreenArmed = false;
    if(S.settings.fullscreen !== false && !document.fullscreenElement) enterFullscreen();
  };
  document.addEventListener("pointerdown", once, true);
  document.addEventListener("keydown", once, true);
}
function isInstalledApp(){
  try{
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      || window.navigator.standalone === true;
  }catch(e){ return false; }
}
/* 새로고침 뒤 권한이 잠겼을 때 — 배너의 [연결하기] 터치로 호출 */
async function grantFolder(){
  if(!dirHandle) return;
  const ok = await ensurePerm(dirHandle, "readwrite", true);
  if(ok){
    fsNeedGrant = false; fsDenied = false;
    await afterFolderReady(); render(); toast("저장 폴더를 다시 연결했습니다");
  } else {
    fsDenied = true; render();
    toast("권한이 허용되지 않았습니다 — [폴더 바꾸기]로 폴더를 다시 골라 주세요");
  }
}

async function videosDir(create){
  if(!dirHandle) return null;
  try{ return await dirHandle.getDirectoryHandle(VID_DIR, {create:!!create}); }
  catch(e){ return null; }
}
async function folderWriteJSON(force, probing){
  if(!dirHandle) return false;
  if(fsMode === "ro" && !probing) return false;
  if(fsWriting && !force) return false;
  fsWriting = true;
  try{
    const out = JSON.parse(JSON.stringify(S));
    out.savedAt = new Date().toISOString();
    out.games.forEach(g=>(g.videos||[]).forEach(v=>{
      if(v.kind==="file" && !v.file) v.file = v.id+"__"+safeName(v.name);
    }));
    const fh = await dirHandle.getFileHandle(DATA_FILE, {create:true});
    const w  = await fh.createWritable();
    await w.write(new Blob([JSON.stringify(out)], {type:"application/json"}));
    await w.close();
    lastFolderSave = Date.now(); fsErr = ""; fsNeedGrant = false;
    return true;
  }catch(e){
    fsErr = errText(e);
    // 쓰기 자체를 허용하지 않는 브라우저 — 권한 문제가 아니라 기능 미지원입니다
    if(e && e.name === "NotAllowedError" && !(dirHandle && dirHandle.queryPermission)){
      if(!probing) downgradeRO();
    } else if(e && (e.name === "NotAllowedError" || e.name === "SecurityError")){
      fsNeedGrant = true; armAutoGrant();
    }
    console.warn("폴더 저장 실패", e);
    return false;
  }finally{ fsWriting = false; }
}
function folderSave(){
  if(!dirHandle || fsNeedGrant || fsMode !== "rw") return;
  clearTimeout(fsSaveTimer);
  fsSaveTimer = setTimeout(()=>{ folderWriteJSON(); }, 1200);
}
/* 영상 추가·삭제처럼 되돌리기 어려운 변화는 기다리지 않고 바로 폴더에 씁니다 */
function flushFolder(){
  if(!dirHandle || fsNeedGrant || fsMode !== "rw") return Promise.resolve(false);
  clearTimeout(fsSaveTimer);
  return folderWriteJSON(true);
}
async function folderReadJSON(){
  if(!dirHandle) return null;
  try{
    const fh = await dirHandle.getFileHandle(DATA_FILE);
    const t  = await (await fh.getFile()).text();
    const o  = JSON.parse(t);
    return (o && Array.isArray(o.games))? o : null;
  }catch(e){ return null; }
}
/* 폴더의 기록으로 앱 상태를 교체 */
async function applyFolderData(o, silent){
  normalizeGames(o.games);
  S.games = o.games;
  if(o.profile)  S.profile  = Object.assign(blank().profile, o.profile);
  if(o.settings) S.settings = Object.assign(blank().settings, o.settings);
  S.ui.year="all"; S.ui.gameId=null;
  saveNow();
  await relinkAll();
  render();
  if(!silent) toast(o.games.length + "경기를 폴더에서 불러왔습니다");
}
async function restoreFolder(){
  if(!dirHandle){ toast("먼저 폴더를 지정해 주세요"); return; }
  const o = await folderReadJSON();
  if(!o){ toast("폴더에 " + DATA_FILE + " 파일이 없습니다"); return; }
  const k = await ask("폴더에서 불러오기",
    `폴더에 <b>${o.games.length}경기</b>가 들어 있습니다.<br>이 기기에는 ${S.games.length}경기가 있습니다.`,
    [{label:"폴더 기록으로 교체", style:"pri"},{label:"현재 기록에 합치기"},{label:"취소"}]);
  if(k===0) await applyFolderData(o);
  else if(k===1){
    normalizeGames(o.games);
    const have=new Set(S.games.map(g=>g.id)); let add=0;
    o.games.forEach(g=>{ if(!have.has(g.id)){ S.games.push(g); add++; }
      else { const cur=S.games.find(x=>x.id===g.id);
        g.videos.forEach(p=>{ if(!cur.videos.some(x=>x.id===p.id)) cur.videos.push(p); }); } });
    saveNow(); await relinkAll(); render(); toast(add + "경기를 추가했습니다");
  }
}

/* ---------------------- 영상 파일 저장소 (폴더 / 기기) ---------------------- */
/* 폴더가 연결돼 있으면 폴더의 videos/ 안에 실제 파일로,
   아니면 지금처럼 브라우저 내부(IndexedDB)에 저장합니다. */
async function mediaPut(v, blob){
  if(dirHandle && !fsNeedGrant && fsMode === "rw"){
    try{
      const vd = await videosDir(true);
      const nm = v.file || (v.id+"__"+safeName(v.name));
      const fh = await vd.getFileHandle(nm, {create:true});
      const w  = await fh.createWritable();
      await w.write(blob); await w.close();
      v.store="fs"; v.file=nm; _vnames=null;
      return "fs";
    }catch(e){
      fsErr = errText(e);
      if(e && e.name === "NotAllowedError" && !(dirHandle && dirHandle.queryPermission)) downgradeRO();
      else if(e && (e.name === "NotAllowedError" || e.name === "SecurityError")){ fsNeedGrant = true; armAutoGrant(); }
      console.warn("폴더 영상 저장 실패 — 기기에 저장합니다", e);
    }
  }
  await idbPut(v.id, blob);
  v.store="idb";
  if(!v.file) v.file = v.id+"__"+safeName(v.name);
  return "idb";
}
let _vnames = null;                 // 폴더 안 파일 이름 캐시
/* videos/ 를 먼저 훑고, 폴더 안의 다른 파일과 한 단계 아래 하위 폴더까지 함께 봅니다.
   그래서 영상 원본을 폴더에 그냥 넣어 두어도 앱이 찾아 재생할 수 있습니다. */
async function fsNames(fresh){
  if(!dirHandle) return null;
  if(_vnames && !fresh) return _vnames;
  const m = new Map();
  const add = (name, h)=>{ if(h && h.kind==="file" && !m.has(name)) m.set(name, h); };
  async function walk(dir, depth){
    if(!dir || m.size > 4000) return;
    try{
      const it = dir.entries? dir.entries() : null;
      if(!it) return;
      for await (const ent of it){
        if(m.size > 4000) return;
        const h = ent[1];
        if(h && h.kind === "file") add(ent[0], h);
        else if(h && depth < 2) await walk(h, depth+1);
      }
    }catch(e){}
  }
  const vd = await videosDir(false);
  if(vd) await walk(vd, 2);
  await walk(dirHandle, 1);
  _vnames = m; return m;
}
async function fsFind(v){
  const m = await fsNames();
  if(!m || !m.size) return null;
  if(v.file && m.has(v.file)) return m.get(v.file);
  for(const k of m.keys()){ if(k.indexOf(v.id+"__")===0 || k===v.id) return m.get(k); }
  const want = nfc(v.file||""), wantN = nfc(v.name||"");
  let loose = null;
  for(const k of m.keys()){
    const n = nfc(k);
    if(want && n === want) return m.get(k);
    if(wantN && n === wantN){
      const h = m.get(k);
      if(!v.size) return h;
      try{ const f = await h.getFile(); if(f.size === v.size) return h; }catch(e){}
      if(!loose) loose = h;                      // 이름은 같고 크기가 다른 경우 (마지막 후보)
    }
  }
  return loose;
}
/* 폴더에 있는 영상 파일을 기록과 맞춰 연결합니다 — 복사하지 않고 그 자리에서 재생합니다 */
async function scanFolderVideos(){
  if(!dirHandle){ toast("먼저 폴더를 지정해 주세요"); return; }
  const list = allVideos();
  if(!list.length){ toast("등록된 영상 기록이 없습니다"); return; }
  busy("폴더에서 영상을 찾는 중");
  _vnames = null;
  await fsNames(true);
  let ok = 0;
  for(let i=0;i<list.length;i++){
    busyUp(i/list.length, (i+1) + " / " + list.length);
    const v = list[i].v;
    try{
      const h = await fsFind(v);
      if(h){ v.store = "fs"; v.file = h.name; ok++; }
    }catch(e){}
  }
  busyEnd(); saveNow(); render();
  toast(ok? ("폴더에서 영상 " + ok + "개를 연결했습니다")
          : "폴더에서 맞는 영상 파일을 찾지 못했습니다 — 파일 이름이 기록과 같아야 합니다");
}
async function mediaGet(v){
  if(dirHandle){
    try{ const h = await fsFind(v); if(h) return await h.getFile(); }catch(e){}
  }
  try{ const b = await idbGet(v.id); if(b) return b; }catch(e){}
  return null;
}
async function mediaHas(v){
  if(dirHandle){
    try{ if(await fsFind(v)) return true; }catch(e){}
  }
  try{ return await idbHas(v.id); }catch(e){ return false; }
}
async function mediaDel(v){
  try{ await idbDel(v.id); }catch(e){}
  if(dirHandle){
    try{
      const vd = await videosDir(false);
      const h  = await fsFind(v);
      if(vd && h) await vd.removeEntry(h.name);
      _vnames = null;
    }catch(e){}
  }
}

/* ============================== ZIP (영상 포함 백업) ==============================
   압축 없이 담기(store)만 씁니다 — 동영상은 이미 압축돼 있어 크기 차이가 없고,
   휴대폰에서도 메모리를 거의 쓰지 않고 빠르게 만들 수 있습니다. */
const CRC_T = (function(){ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1)? (0xEDB88320^(c>>>1)) : (c>>>1); t[n]=c>>>0; }
  return t; })();
function crcPush(c, buf){ for(let i=0;i<buf.length;i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c>>>8); return c>>>0; }
async function blobCrc(blob){
  let c = 0xFFFFFFFF;
  if(blob.stream){
    const rd = blob.stream().getReader();
    for(;;){ const r = await rd.read(); if(r.done) break; c = crcPush(c, r.value); }
  } else {
    c = crcPush(c, new Uint8Array(await blob.arrayBuffer()));
  }
  return (c ^ 0xFFFFFFFF)>>>0;
}
function dosTime(d){ return ((d.getHours()<<11) | (d.getMinutes()<<5) | ((d.getSeconds()/2)|0)) & 0xFFFF; }
function dosDate(d){ return (((d.getFullYear()-1980)<<9) | ((d.getMonth()+1)<<5) | d.getDate()) & 0xFFFF; }
async function zipMake(files, onProg){
  const enc = new TextEncoder(), now = new Date();
  const tm = dosTime(now), dt = dosDate(now);
  const parts = [], cen = [];
  let off = 0;
  for(let i=0;i<files.length;i++){
    const f = files[i];
    if(onProg) onProg(i/files.length, f.name);
    const nb = enc.encode(f.name);
    const size = f.blob.size;
    const crc = await blobCrc(f.blob);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, tm, true); lh.setUint16(12, dt, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, nb, f.blob);
    cen.push({nb:nb, crc:crc, size:size, off:off});
    off += 30 + nb.length + size;
  }
  const cdStart = off;
  let cdSize = 0;
  for(const e of cen){
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, tm, true); ch.setUint16(14, dt, true);
    ch.setUint32(16, e.crc, true); ch.setUint32(20, e.size, true); ch.setUint32(24, e.size, true);
    ch.setUint16(28, e.nb.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true);
    ch.setUint32(42, e.off, true);
    parts.push(ch.buffer, e.nb);
    cdSize += 46 + e.nb.length;
  }
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true); eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
  eo.setUint16(8, cen.length, true); eo.setUint16(10, cen.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, cdStart, true); eo.setUint16(20, 0, true);
  parts.push(eo.buffer);
  if(onProg) onProg(1, "");
  return new Blob(parts, {type:"application/zip"});
}
async function zipRead(blob){
  const tailLen = Math.min(blob.size, 66000);
  const tail = new Uint8Array(await blob.slice(blob.size - tailLen).arrayBuffer());
  let p = -1;
  for(let i=tail.length-22; i>=0; i--){
    if(tail[i]===0x50 && tail[i+1]===0x4b && tail[i+2]===0x05 && tail[i+3]===0x06){ p=i; break; }
  }
  if(p<0) throw new Error("zip 파일이 아닙니다");
  const base = blob.size - tailLen;
  const eo = new DataView(tail.buffer, tail.byteOffset+p, 22);
  const cnt = eo.getUint16(8, true), cdSize = eo.getUint32(12, true), cdOff = eo.getUint32(16, true);
  const cd = new DataView(await blob.slice(cdOff, cdOff+cdSize).arrayBuffer());
  const dec = new TextDecoder();
  const out = []; let o = 0;
  for(let i=0;i<cnt && o+46<=cd.byteLength;i++){
    if(cd.getUint32(o, true) !== 0x02014b50) break;
    const method = cd.getUint16(o+10, true);
    const csize  = cd.getUint32(o+20, true);
    const nlen   = cd.getUint16(o+28, true);
    const elen   = cd.getUint16(o+30, true);
    const clen   = cd.getUint16(o+32, true);
    const lho    = cd.getUint32(o+42, true);
    const name   = dec.decode(new Uint8Array(cd.buffer, cd.byteOffset+o+46, nlen));
    out.push({name:name, method:method, csize:csize, lho:lho});
    o += 46 + nlen + elen + clen;
  }
  for(const e of out){
    const lh = new DataView(await blob.slice(e.lho, e.lho+30).arrayBuffer());
    const n = lh.getUint16(26, true), x = lh.getUint16(28, true);
    const st = e.lho + 30 + n + x;
    let b = blob.slice(st, st + e.csize);
    if(e.method === 8){
      if(typeof DecompressionStream === "undefined") throw new Error("이 브라우저에서는 압축된 zip을 열 수 없습니다");
      b = await new Response(b.stream().pipeThrough(new DecompressionStream("deflate-raw"))).blob();
    } else if(e.method !== 0){
      throw new Error("지원하지 않는 zip 압축 방식입니다");
    }
    e.blob = b;
  }
  return out;
}

function relinkVideos(){
  if(!missCache.length){ toast("다시 연결할 영상이 없습니다"); return; }
  const inp = document.createElement("input");
  inp.type = "file"; inp.multiple = true; inp.accept = "video/*";
  inp.addEventListener("change", async ()=>{
    const fs = Array.from(inp.files||[]);
    if(!fs.length) return;
    busy("영상을 다시 연결하는 중");
    let ok=0, skip=0;
    const pool = missCache.slice();
    for(let i=0;i<fs.length;i++){
      const f = fs[i];
      busyUp(i/fs.length, (i+1) + " / " + fs.length + " · " + f.name);
      const fn = nfc(f.name);
      let idx = pool.findIndex(x=> nfc(x.v.file)===fn);
      if(idx<0) idx = pool.findIndex(x=> f.name.indexOf(x.v.id+"__")===0);
      if(idx<0) idx = pool.findIndex(x=> nfc(x.v.name)===fn && x.v.size===f.size);
      if(idx<0) idx = pool.findIndex(x=> nfc(x.v.name)===fn);
      if(idx<0) idx = pool.findIndex(x=> x.v.size===f.size);
      if(idx<0){ skip++; continue; }
      const it = pool.splice(idx,1)[0];
      try{ await mediaPut(it.v, f); it.v.size = f.size; ok++; }catch(e){ skip++; console.warn(e); }
    }
    _vnames=null; busyEnd(); saveNow(); await flushFolder(); render();
    toast("영상 " + ok + "개를 다시 연결했습니다" + (skip? " · " + skip + "개는 맞는 기록을 찾지 못했습니다" : ""));
  });
  inp.click();
}
