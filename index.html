document.addEventListener("click", ev=>{
  const nav = ev.target.closest("nav.tabs button");
  if(nav){ S.ui.tab = nav.dataset.nav; S.ui.gameId = null; save(); render(); return; }

  const tg = ev.target.closest("[data-toggle]");
  if(tg){ const box=document.getElementById(tg.dataset.toggle);
    const open = box.hasAttribute("hidden");
    if(open) box.removeAttribute("hidden"); else box.setAttribute("hidden","");
    tg.setAttribute("aria-expanded", String(open)); tg.textContent = open? "차트" : "표"; return; }
  const bd = ev.target.classList && ev.target.classList.contains("backdrop");
  if(bd){ closeSheet(); return; }

  const el = ev.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id, gid = el.dataset.gid, v = el.dataset.v;

  switch(a){
    case "close": closeSheet(); break;
    case "nav": S.ui.tab=v; S.ui.gameId=null; save(); render(); break;
    case "year": S.ui.year=v; save(); render(); break;
    case "metric": S.ui.metric=v; save(); render(); break;
    case "level": S.settings.level=v; saveNow(); render(); toast(LEVELS[v].ko+" 규격으로 바꿨습니다"); break;
    case "saveInn": {
      const n = clamp(num($("#set_inn").value, LEVELS[curLevel()].inn), 1, 15);
      S.settings.inningsBy[curLevel()] = n;
      saveNow(); render(); toast(LEVELS[curLevel()].ko+" 정규 "+n+"이닝으로 설정했습니다"); break; }

    case "newGame": gameSheet(null); break;
    case "editGame": gameSheet(id); break;
    case "saveGame": {
      const d = readGameSheet();
      if(id){ const g=S.games.find(x=>x.id===id); Object.assign(g,d); }
      else { const g=Object.assign({id:uid(), pas:[], def:[], videos:[]}, d); S.games.push(g); S.ui.tab="games"; S.ui.gameId=g.id; }
      saveNow(); closeSheet(); render(); toast("저장했습니다"); break; }
    case "delGame":
      ask("경기 삭제","이 경기의 타석·수비·영상 기록이 모두 삭제됩니다. 되돌릴 수 없습니다.",
        [{label:"삭제",style:"dan"},{label:"취소"}]).then(k=>{
        if(k!==0) return;
        const g=S.games.find(x=>x.id===id);
        (g.videos||[]).filter(x=>x.kind==="file").forEach(x=> idbDel(x.id).catch(()=>{}));
        S.games = S.games.filter(x=>x.id!==id); S.ui.gameId=null; S.ui.tab="games";
        saveNow(); render(); toast("삭제했습니다");
      }); break;
    case "openGame": S.ui.tab="games"; S.ui.gameId=id; save(); render(); break;

    case "newPA": paSheet(gid, null); break;
    case "editPA": paSheet(gid, id); break;
    case "pickResult": {
      draft.result = (draft.result===v)? "" : v;
      $$("#modal .chip").forEach(c=> c.setAttribute("aria-pressed", String(c.dataset.v===draft.result)));
      const canBip = hasBIP(draft.result);
      const wrap = $("#modal #pa_zone_wrap");
      if(wrap){
        wrap.hidden = !canBip;
        if(!canBip){
          draft.zone = null;
          const zm = $("#modal #zmark"); if(zm) zm.innerHTML = "";
          const zl = $("#modal #pa_zlabel"); if(zl) zl.textContent = "선택 안 됨";
        } else if(paPaint) paPaint();
      }
      break; }
    case "clearZone": draft.zone=null; $("#modal #zmark").innerHTML=""; $("#modal #pa_zlabel").textContent="선택 안 됨"; break;
    case "savePA": {
      if(!draft.result){ toast("타석 결과를 선택해 주세요"); return; }
      const g = S.games.find(x=>x.id===gid);
      const rec = {id: id||uid(), inning:num($("#pa_inn").value,1), pitcher:$("#pa_pit").value.trim(),
        result:draft.result, zone: hasBIP(draft.result)? draft.zone : null, rbi:num($("#pa_rbi").value,0), runs:num($("#pa_run").value,0),
        sb:num($("#pa_sb").value,0), cs:0, note:$("#pa_note").value.trim()};
      if(id){ const i=g.pas.findIndex(x=>x.id===id); g.pas[i]=rec; } else g.pas.push(rec);
      g.pas.sort((x,y)=> num(x.inning,0)-num(y.inning,0));
      saveNow(); closeSheet(); render(); toast(RMAP[rec.result].ko+" 기록"); break; }
    case "delPA": {
      const g=S.games.find(x=>x.id===gid); g.pas=g.pas.filter(x=>x.id!==id);
      saveNow(); closeSheet(); render(); toast("타석을 삭제했습니다"); break; }

    case "newDef": defSheet(gid, null); break;
    case "editDef": defSheet(gid, id); break;
    case "saveDef": {
      const g=S.games.find(x=>x.id===gid);
      const rec = {id:id||uid(), pos:$("#d_pos").value, innings:$("#d_inn").value.trim(),
        po:num($("#d_po").value,0), a:num($("#d_a").value,0), e:num($("#d_e").value,0), dp:num($("#d_dp").value,0)};
      if(!rec.pos){ toast("포지션을 선택해 주세요"); return; }
      if(id){ const i=g.def.findIndex(x=>x.id===id); g.def[i]=rec; } else g.def.push(rec);
      saveNow(); closeSheet(); render(); toast("수비 기록을 저장했습니다"); break; }
    case "delDef": {
      const g=S.games.find(x=>x.id===gid); g.def=g.def.filter(x=>x.id!==id);
      saveNow(); closeSheet(); render(); toast("삭제했습니다"); break; }

    case "newVideo": videoSheet(gid); break;
    case "vkind":
      $$("#modal .seg [data-act='vkind']").forEach(b=> b.setAttribute("aria-pressed", String(b.dataset.v===v)));
      $("#v_file").hidden = v!=="file"; $("#v_link").hidden = v!=="link"; break;
    case "saveVideo": saveVideo(gid, el); break;
    case "playVideo": playVideo(gid, id); break;
    case "openVideo": openVideoTab(gid, id); break;
    case "autoplay": S.settings.autoplay=v; saveNow(); render(); toast("자동 재생: "+AUTOPLAY[v]); break;
    case "theme": setTheme(v); break;
    case "toggleVG": {
      if(openVG.has(id)) openVG.delete(id); else openVG.add(id);
      render(); break; }
    case "delVideo":
      ask("영상 삭제","이 영상을 기록에서 삭제합니다. 업로드한 파일도 기기에서 지워집니다.",
        [{label:"삭제",style:"dan"},{label:"취소"}]).then(k=>{
        if(k!==0) return;
        const g=S.games.find(x=>x.id===gid);
        const vv=g.videos.find(x=>x.id===id);
        if(vv && vv.kind==="file"){ idbDel(id).catch(()=>{});
          if(blobURLs[id]){ try{ URL.revokeObjectURL(blobURLs[id]); }catch(e){} delete blobURLs[id]; } }
        g.videos = g.videos.filter(x=>x.id!==id);
        saveNow(); render(); toast("영상을 삭제했습니다");
      }); break;

    case "step": {
      const inp = document.getElementById(el.dataset.t); if(!inp) return;
      const mn = inp.min!==""? num(inp.min,0) : -Infinity, mx = inp.max!==""? num(inp.max,0) : Infinity;
      inp.value = String(clamp(num(inp.value,0) + num(el.dataset.d,0), mn, mx)); break; }

    case "saveProfile":
      S.profile = {name:$("#pf_name").value.trim(), team:$("#pf_team").value.trim(), number:$("#pf_num").value.trim(),
        position:$("#pf_pos").value, bats:$("#pf_bats").value, throws:$("#pf_thr").value};
      saveNow(); render(); toast("선수 정보를 저장했습니다"); break;

    case "exportJSON": exportJSON(); break;
    case "importJSON": importJSON(); break;
    case "showJSON": showJSON(); break;
    case "copyJSON": copyJSON(); break;
    case "pasteJSON": pasteJSON(); break;
    case "applyPaste": applyPaste(); break;
    case "exportCSV": exportCSV(); break;
    case "exportDefCSV": exportDefCSV(); break;
    case "wipe":
      ask("전체 기록 삭제","모든 경기·타석·수비·영상 기록이 이 기기에서 완전히 삭제됩니다.<br>먼저 JSON으로 백업하는 것을 권합니다.",
        [{label:"모두 삭제",style:"dan"},{label:"취소"}]).then(k=>{
        if(k!==0) return;
        S.games.forEach(g=>(g.videos||[]).forEach(v=>{ if(v.kind==="file") idbDel(v.id).catch(()=>{}); }));
        S = blank(); saveNow(); render(); toast("모두 삭제했습니다");
      }); break;
  }
});

function saveVideo(gid, btn){
  const g = S.games.find(x=>x.id===gid); if(!g) return;
  const kind = ($("#modal [data-act='vkind'][aria-pressed='true']")||{dataset:{v:"file"}}).dataset.v;
  const title = $("#v_title").value.trim();
  const paId = $("#v_pa").value || null;
  const note = $("#v_note").value.trim();
  if(kind==="link"){
    const url = $("#v_url").value.trim();
    if(!url){ toast("영상 주소를 입력해 주세요"); return; }
    g.videos.push({id:uid(), kind:"link", url, title:title||url.slice(0,60), paId, note, createdAt:Date.now()});
    saveNow(); closeSheet(); render(); toast("영상 링크를 추가했습니다"); return;
  }
  const f = ($("#v_input").files||[])[0];
  if(!f){ toast("동영상 파일을 선택해 주세요"); return; }
  if(f.size > 800*1024*1024){ toast("800MB 이하 파일만 저장할 수 있습니다"); return; }
  const id = uid();
  btn.disabled = true; $("#v_prog").hidden = false;
  $("#v_prog .bar > i").style.width = "40%";
  idbPut(id, f).then(()=>{
    $("#v_prog .bar > i").style.width = "100%";
    g.videos.push({id, kind:"file", name:f.name, mime:f.type, size:f.size,
      title:title||f.name.replace(/\.[^.]+$/,""), paId, note, createdAt:Date.now()});
    saveNow(); closeSheet(); render(); toast("영상을 이 기기에 저장했습니다");
  }).catch(e=>{
    btn.disabled = false; $("#v_prog").hidden = true;
    toast("저장 실패: 공간이 부족할 수 있습니다");
    console.error(e);
  });
}

/* ------------------------------ 렌더 / 초기화 ------------------------------ */
const ENV = {storage:true, idb:true};
const openVG = new Set();   // 영상 화면에서 펼쳐 둔 경기
function envBanner(){
  const v=$("#view"); if(!v) return;
  if(document.getElementById("envwarn")) return;
  if(ENV.storage && ENV.idb) return;
  const d=document.createElement("div"); d.id="envwarn"; d.className="note";
  d.style.cssText="margin-bottom:12px;border:1px solid var(--border)";
  d.innerHTML = !ENV.storage
    ? "이 브라우저(시크릿 모드 등)에서는 기록이 <b>저장되지 않습니다</b>. 일반 창에서 열어 주세요."
    : "이 환경에서는 동영상 <b>파일 저장</b>을 쓸 수 없습니다. 영상은 <b>링크 등록</b>으로 추가하거나, 이 파일을 웹 주소(http/https)로 열어 주세요.";
  v.insertBefore(d, v.firstChild);
}
let lastTab = null;
function render(){
  const v = $("#view");
  calcChartFont();
  const t = S.ui.tab;
  const html = (t==="games" && S.ui.gameId)? viewGame(S.ui.gameId)
    : t==="games"? viewGames()
    : t==="stats"? viewStats()
    : t==="videos"? viewVideos()
    : t==="settings"? viewSettings()
    : viewHome();
  v.innerHTML = html;
  $$("nav.tabs button").forEach(b=>{
    if(b.dataset.nav===t) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const sb = $("#setBtn");
  if(sb){ sb.classList.toggle("on", t==="settings"); sb.setAttribute("aria-current", t==="settings"? "page":"false"); }
  const p = S.profile;
  $("#subttl").textContent = p.name? [p.name, p.number?"#"+p.number:"", p.team].filter(Boolean).join(" · ") : "기록 · 분석 · 영상";
  if(lastTab!==t){ window.scrollTo(0,0); lastTab=t; }
  envBanner();
  fillQuota();
}
/* 영구 저장 요청 — 기기 저장공간이 부족할 때 시스템이 기록·영상을
   임의로 지우지 못하게 합니다. 홈 화면에 추가해 두면 승인될 확률이 높습니다. */
function askPersist(){
  if(!(navigator.storage && navigator.storage.persist)){ persistState="unsupported"; return Promise.resolve(); }
  return navigator.storage.persisted().then(already=>{
    if(already){ persistState=true; return; }
    return navigator.storage.persist().then(ok=>{ persistState=!!ok; });
  }).catch(()=>{ persistState="unsupported"; });
}

function fillQuota(){
  const els = $$("#quota"); if(!els.length) return;
  const tag = ()=>{
    if(persistState===true)  return `<span style="color:var(--good);font-weight:650">자동 저장 켜짐`;
    if(persistState===false) return `<span style="color:var(--warn);font-weight:650">자동 저장 꺼짐</span> - 기기 저장공간 부족`;
    return `영구 저장 상태를 확인할 수 없는 브라우저입니다.`;
  };
  const warn = saveFailed
    ? `<br><span style="color:var(--crit);font-weight:650">⚠ 마지막 저장이 실패했습니다.</span> 지금 바로 JSON으로 내보내 두세요.`
    : "";
  const draw = txt => els.forEach(e=> e.innerHTML = txt + `<br>` + tag() + warn);
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(q=>{
      const used = q.usage||0, quota = q.quota||0;
      draw(`이 기기 저장 사용량 <b>${bytes(used)}</b>${quota?` / 약 ${bytes(quota)} 사용 가능`:""}`);
    }).catch(()=> draw("저장 공간 정보를 확인할 수 없습니다"));
  } else draw("저장 공간 정보를 확인할 수 없습니다");
}
function curTheme(){ return document.documentElement.getAttribute("data-theme") || ""; }
function setTheme(v){
  if(v) document.documentElement.setAttribute("data-theme", v);
  else document.documentElement.removeAttribute("data-theme");
  try{ v? localStorage.setItem(THEME_KEY, v) : localStorage.removeItem(THEME_KEY); }catch(e){}
  render();
}
(function init(){
  try{ const th = localStorage.getItem(THEME_KEY); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
  load();
  try{ localStorage.setItem("__bb_t","1"); localStorage.removeItem("__bb_t"); }
  catch(e){ ENV.storage=false; }
  db().then(()=>{ ENV.idb=true; }).catch(()=>{ ENV.idb=false; envBanner(); });
  // 앱은 언제나 홈 화면에서 시작합니다 (마지막에 보던 탭을 복원하지 않음)
  S.ui.tab = "home"; S.ui.gameId = null;
  render();
  askPersist().then(fillQuota);
  window.addEventListener("beforeunload", saveNow);

  // 화면 회전·창 크기 변경 시 차트 글자 크기를 다시 맞춥니다
  let rsTimer = null;
  window.addEventListener("resize", ()=>{
    clearTimeout(rsTimer);
    rsTimer = setTimeout(()=>{ const before = CFS; calcChartFont();
      if(Math.abs(before-CFS) > 0.2) render(); }, 200);
  });
  // 모바일은 beforeunload가 안 불리는 경우가 많아 화면 이탈 시점에도 저장
  window.addEventListener("pagehide", saveNow);
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="hidden"){ saveNow(); return; }
    // 앱으로 돌아왔을 때 홈 화면으로. 단 입력 중(시트가 열려 있음)이면 그대로 둡니다.
    if($("#modal").innerHTML) return;
    if(S.ui.tab!=="home" || S.ui.gameId){ S.ui.tab="home"; S.ui.gameId=null; saveNow(); render(); }
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#modal").innerHTML) closeSheet(); });
  // 개발용 훅 (자동 검증에 사용)
  window.__bb = {get S(){return S;}, set S(v){S=v;}, render, save:saveNow, battingOf, fieldingOf, zoneOf, sampleData, inn2outs, RMAP};
})();
</script>
